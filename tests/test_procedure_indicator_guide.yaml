# Minimal procedure guide for visual-evidence and elapsed-timer regressions.
schema_version: 1
task:
  id: indicator_check
  name: Indicator Check
  version: 1
  status: approved
  start_step: indicator
  foreground_prompt: Guide checking a blue indicator, followed by a timed wait.
  complete_message: Indicator check finished.
state:
  visible:
    type: boolean
    description: The indicator is blue.
    initial: false
  waited:
    type: boolean
    description: The wait has elapsed.
    initial: false
steps:
  - id: indicator
    title: Check indicator
    writes: [visible]
    trigger:
      function: current_view
      interval_s: 0.2
      arguments:
        question: Is the large rectangle blue? Answer only YES or NO.
    evidence:
      pattern: '(?i)^YES$'
      consecutive: 2
      commit: {visible: true}
    voice:
      prompt: Describe the indicator and explain how to check its color.
      tools: [current_view]
    complete_when: {visible: true}
    next: wait
    messages:
      enter: Show a blue indicator.
      complete: The indicator is blue. Say next.
      skip: Indicator skipped.
  - id: wait
    title: Wait
    writes: [waited]
    trigger:
      function: clock__timer
      interval_s: 0.2
      arguments: {duration_s: 10}
      result_field: expired
    evidence:
      pattern: 'true'
      consecutive: 1
      commit: {waited: true}
    voice:
      prompt: Use the timer to answer questions about the wait.
      tools: [clock__timer]
    complete_when: {waited: true}
    next: null
    finish_on_complete: true
    messages:
      enter: The ten-second wait has started.
      complete: The wait is complete.
      skip: Wait skipped.
