# Original synthetic capture excerpts. Feed input only; reserve checks for scoring.
- id: stale_caption_additions
  input:
    packet: {session_id: synthetic-rack, status: complete}
    captions:
      - {caption_id: 1, frame_id: 1, frame_timestamp_us: 1000000, caption: "An empty rack lies on a table."}
      - {caption_id: 2, frame_id: 2, frame_timestamp_us: 5000000, caption: "An empty rack lies on a table."}
    transcripts:
      - {transcript_id: 1, timestamp_us: 1500000, text: "Insert the left divider into the rack."}
      - {transcript_id: 2, timestamp_us: 2500000, text: "Now the right divider."}
      - {transcript_id: 3, timestamp_us: 3500000, text: "Clip the yellow handle onto the front with the notch facing up."}
      - {transcript_id: 4, timestamp_us: 4500000, text: "Sorry, I was adjusting the camera."}
    media_access: "No images supplied in this text-only probe. Do not claim to have inspected them."
  checks:
    - "Retains three distinct actions: left divider, right divider, handle."
    - "Handle trigger question includes clipping/attachment, front, and notch facing up."
    - "Does not turn camera adjustment into a step or copy the example workpiece task."
    - "Records stale-caption conflict and unavailable-image review gap with actual source IDs."

- id: prerequisite_count
  input:
    packet: {session_id: synthetic-spacers, status: complete}
    captions:
      - {caption_id: 1, frame_id: 1, frame_timestamp_us: 1000000, caption: "A lid beside a base; two of its spacers are visible."}
    transcripts:
      - {transcript_id: 1, timestamp_us: 1000000, text: "The four spacers are already mounted. Check all four before placing the lid."}
      - {transcript_id: 2, timestamp_us: 2000000, text: "Place the lid on the base with the arrow toward the handle."}
    media_access: "No images supplied."
  checks:
    - "Four spacers are a prerequisite check, not a new installation instruction."
    - "The actual prerequisite question requires all four; two visible does not prove four."
    - "Lid verification question includes arrow toward the handle and placement on the base."
    - "Records partial visibility as a gap, without inventing missing assembly operations."

- id: ambiguous_speech
  input:
    packet: {session_id: synthetic-label, status: complete}
    captions:
      - {caption_id: 1, frame_id: 1, frame_timestamp_us: 1000000, caption: "A hand holds an unreadable small object above a folder."}
    transcripts:
      - {transcript_id: 1, timestamp_us: 1000000, text: "Put the sticky nose on the folder's upper right corner."}
    media_access: "No images supplied."
  checks:
    - "Preserves placement and upper right target instead of discarding the action."
    - "Flags probable sticky-note transcription ambiguity rather than silently asserting a correction."
    - "No claim of image inspection or confirmed attachment; remains draft pending clarification."

- id: instructed_timer
  input:
    packet: {session_id: synthetic-pad, status: complete}
    captions:
      - {caption_id: 1, frame_id: 1, frame_timestamp_us: 1000000, caption: "A blue pad lies flat inside a marked tray."}
    transcripts:
      - {transcript_id: 1, timestamp_us: 1000000, text: "Place the blue pad inside the tray, then wait fifteen seconds from placement."}
    media_access: "No images supplied."
  checks:
    - "Separate visual setup and timer wait with duration_s 15, not the example's 10."
    - "Setup uses clock__now and atomically saves its live epoch_us plus setup boolean."
    - "Setup has no evidence.commit, and complete_on_skip true prevents uninitialized timer entry."
    - "Wait uses clock__timer, saved start in reads, expired result, ^true$ and direct boolean commit."
    - "No visual checks on wait, invented timestamp, or claim of continuously maintained placement."

- id: unsupported_sequence_and_duration
  input:
    packet: {session_id: synthetic-dial, status: complete}
    captions:
      - {caption_id: 1, frame_id: 1, frame_timestamp_us: 1000000, caption: "The dial points to the upper mark."}
    transcripts:
      - {transcript_id: 1, timestamp_us: 1000000, text: "Turn the dial fully left, then right, then return it to the upper mark."}
      - {transcript_id: 2, timestamp_us: 2000000, text: "Keep pressing the spring tab for ten to twenty seconds."}
    media_access: "No images supplied."
  checks:
    - "Retains dial ordering and spring-tab contact requirements without pretending final view proves them."
    - "Flags sequence verification, continuous contact, and ambiguous duration as blockers."
    - "Does not invent sequence_view or choose duration_s 15 from the range."
    - "Unsupported checks use never-matching evidence and no direct completion commit."
    - "Guide validates structurally but remains draft, with blockers in review notes."
