[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-tests"
version = "0.1.0"
description = "Multi-client / multi-agent integration tests for xr-ai."
requires-python = ">=3.11,<3.15"
dependencies = [
    # Pulled in via editable installs of the workspace packages.
    "xr-ai-agent-runtime",
    "xr-ai-hub-client",
    "xr-ai-models[riva]",
    "xr-ai-tools[frames,image-editing,marker-tracking,services,vision]",
    "xr-ai-voice",
    "xr-ai-web-events",
    "device-io-hub",
    "xr-ai-launcher",
    "xr-ai-logging",
    "xr-ai-vad",
    "xr-ai-voicegate",
    "xr-ai-vllm",
    "xr-render-demo-eval",
    "xr-render-demo-worker",
    "xr-render-scene",
    "xr-video-memory-service",
    "xr-rag-service",
    # Test runner.
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "numpy>=1.24",
    # Direct test deps used across CPU native vision/service tests and GPU coverage.
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[tool.uv.sources]
xr-ai-agent-runtime      = { path = "../agent-sdk/xr-ai-runtime",       editable = true }
xr-ai-hub-client           = { path = "../agent-sdk/xr-ai-hub",                        editable = true }
xr-ai-models          = { path = "../agent-sdk/xr-ai-models",           editable = true }
xr-ai-tools           = { path = "../agent-sdk/xr-ai-tools",            editable = true }
xr-ai-voice           = { path = "../agent-sdk/xr-ai-voice",            editable = true }
xr-ai-web-events      = { path = "../agent-sdk/xr-ai-web-events",       editable = true }
device-io-hub          = { path = "../services/device-io-hub",             editable = true }
xr-ai-launcher        = { path = "../utils/xr-ai-launcher",             editable = true }
xr-ai-logging         = { path = "../utils/xr-ai-logging",              editable = true }
xr-ai-vad             = { path = "../utils/xr-ai-vad",                  editable = true }
xr-ai-voicegate       = { path = "../utils/xr-ai-voicegate",            editable = true }
xr-ai-vllm            = { path = "../utils/xr-ai-vllm",                 editable = true }
xr-render-demo-eval   = { path = "../agent-samples/xr-render-demo/eval",   editable = true }
xr-render-demo-worker = { path = "../agent-samples/xr-render-demo/worker", editable = true }
xr-render-scene       = { path = "../agent-samples/xr-render-demo/scene",  editable = true }
xr-video-memory-service = { path = "../services/video-memory-service", editable = true }
xr-rag-service          = { path = "../services/rag-service", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["."]
# stt-server is on pythonpath (not a dependency) so the endpoint tests can
# import its FastAPI app without pulling the NeMo dependency tree.
pythonpath   = ["../services/openxr-service", "../services/stt-server"]
markers = [
    "gpu: requires local GPU / Docker / NVENC; skipped in CI",
    "integration: spawns a real server subprocess (CPU-only); runs in CI",
]
