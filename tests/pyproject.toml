[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-tests"
version = "0.1.0"
description = "Multi-client / multi-agent integration tests for xr-ai."
requires-python = ">=3.11,<3.15"
dependencies = [
    # Pulled in via editable installs of the workspace packages.
    "xr-ai-agent-runtime",
    "xr-ai-interaction",
    "xr-ai-routing",
    "xr-ai-conversation",
    "xr-ai-hub-client",
    "xr-ai-models[riva]",
    "xr-ai-tools[frames,image-editing,marker-tracking,services,vision]",
    "xr-ai-voice",
    "xr-ai-web-events",
    "device-io-hub",
    "xr-ai-launcher",
    "xr-ai-gpu",
    "xr-ai-model-server-stack",
    "xr-ai-logging",
    "xr-ai-vad",
    "xr-ai-voicegate",
    "xr-ai-vllm",
    "xr-render-demo-eval",
    "xr-render-demo-worker",
    "xr-render-scene",
    "xr-video-memory-service",
    "xr-rag-service",
    # Test runner.
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Measures which SDK and service code the suite exercises; see [tool.coverage].
    "coverage>=7.10",
    "numpy>=1.24",
    # Direct test deps used across CPU native vision/service tests and GPU coverage.
    "audioop-lts; python_version >= '3.13'",
    # Local-first model resolution tests run the real Hub cache lookup.
    "huggingface-hub>=0.32.0",
    "Pillow>=10.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[tool.uv.sources]
xr-ai-gpu = { path = "../utils/xr-ai-gpu", editable = true }
xr-ai-model-server-stack = { path = "../utils/xr-ai-model-server-stack", editable = true }
xr-ai-agent-runtime      = { path = "../agent-sdk/xr-ai-runtime",       editable = true }
xr-ai-routing            = { path = "../agent-sdk/xr-ai-routing",       editable = true }
xr-ai-conversation       = { path = "../agent-sdk/xr-ai-conversation",  editable = true }
xr-ai-interaction        = { path = "../agent-sdk/xr-ai-interaction",   editable = true }
xr-ai-hub-client           = { path = "../agent-sdk/xr-ai-hub",                        editable = true }
xr-ai-models          = { path = "../agent-sdk/xr-ai-models",           editable = true }
xr-ai-tools           = { path = "../agent-sdk/xr-ai-tools",            editable = true }
xr-ai-voice           = { path = "../agent-sdk/xr-ai-voice",            editable = true }
xr-ai-web-events      = { path = "../agent-sdk/xr-ai-web-events",       editable = true }
device-io-hub          = { path = "../services/device-io-hub",             editable = true }
xr-ai-launcher        = { path = "../utils/xr-ai-launcher",             editable = true }
xr-ai-logging         = { path = "../utils/xr-ai-logging",              editable = true }
xr-ai-vad             = { path = "../utils/xr-ai-vad",                  editable = true }
xr-ai-voicegate       = { path = "../utils/xr-ai-voicegate",            editable = true }
xr-ai-vllm            = { path = "../utils/xr-ai-vllm",                 editable = true }
xr-render-demo-eval   = { path = "../agent-samples/xr-render-demo/eval",   editable = true }
xr-render-demo-worker = { path = "../agent-samples/xr-render-demo/worker", editable = true }
xr-render-scene       = { path = "../agent-samples/xr-render-demo/scene",  editable = true }
xr-video-memory-service = { path = "../services/video-memory-service", editable = true }
xr-rag-service          = { path = "../services/rag-service", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["."]
# Inference services are on pythonpath rather than dependencies so synthetic
# endpoint and routing tests do not install the NeMo inference environments.
pythonpath   = ["../services/openxr-service", "../services/stt-server", "../services/speaker-stt"]
markers = [
    "gpu: requires local GPU / Docker / NVENC; skipped in CI",
    "integration: spawns a real server subprocess (CPU-only); runs in CI",
]

# The measured packages are the SDK, utilities, and services that the test
# project installs or puts on its pytest `pythonpath`, not samples. A package
# missing from `source_pkgs` does not appear in the report. Run from tests/ as
# CI does:
#   coverage run -m pytest -m "not gpu" && coverage json
# then `python3 ../.github/scripts/coverage_summary.py coverage.json`.
[tool.coverage.run]
branch = true
source_pkgs = [
    "device_io_hub",
    "openxr_service",
    "rag_service",
    "speaker_stt",
    "stt_server",
    "video_memory_service",
    "xr_ai_conversation",
    "xr_ai_hub",
    "xr_ai_launcher",
    "xr_ai_gpu",
    "xr_ai_logging",
    "xr_ai_model_server_stack",
    "xr_ai_models",
    "xr_ai_runtime",
    "xr_ai_routing",
    "xr_ai_tools",
    "xr_ai_vad",
    "xr_ai_vllm",
    "xr_ai_voice",
    "xr_ai_voicegate",
    "xr_ai_web_events",
]

[tool.coverage.report]
skip_empty = true
# Type-only and abstract code that has no runtime behavior to test.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]
