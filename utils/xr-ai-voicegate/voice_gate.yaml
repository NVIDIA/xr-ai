# Voice-gate reference: copy into your sample and select it with voice_gate_yaml
# in the worker configuration. load_voice_gate_config(Path(...)) parses it;
# this file is not discovered automatically or inherited by sample YAMLs.
# Values below preserve the loader's behavior when settings are omitted.
# No environment-variable substitution or relative file paths are used here.

# Empty means every non-STOP transcript is eligible in wake-only mode.
# To require a wake phrase, use e.g. ["hey agent"]. Matches start a sentence.
magic_phrases: []
# A follow-up utterance may begin this many seconds after a phrase match
# without repeating it, even if the utterance finishes after that window.
followup_grace_s: 5.0
# Available only with magic_phrases; the consumer must call play_chime.
listening_chime: true
# false makes STOP words follow normal query gating, useful for passive input.
# This does not disable conversation start/stop controls below.
stop_commands_enabled: true

# Optional conversation controls. Omission disables them. This explicit false
# preserves that behavior; change to true for a closed-until-start conversation.
# When enabled, these are the field defaults (enabled itself defaults to true
# when a conversation mapping is supplied).
conversation:
  enabled: false
  start_phrase: "Hey agent, let's start talking"
  stop_phrase: "Hey agent, let's stop talking"
  # false permits natural speech while the conversation is open; true also
  # requires magic_phrases (and permits the follow-up window) for queries.
  require_wake_phrase: false
  # Maximum onset window for joining exact control-phrase fragments.
  phrase_window_s: 6.0

# Optional speaker-conditioned streaming ASR. In this reference both
# conversation.enabled and speaker.enabled must be true to use this path.
# The base defaults remain off. Older speaker-only files implicitly enable
# conversation controls; an explicit disabled conversation overrides that.
# Keep conversation controls in the mapping above, not duplicated under speaker.
speaker:
  enabled: false
  # HTTP origin including port; no credentials, API path, query, or fragment.
  base_url: http://127.0.0.1:8102
  # auto can use the supplied batch STT when speaker ASR is unavailable.
  # required fails closed instead; choose required for a speaker-only stack.
  # VoiceAgent.from_models needs a batch STT role unless required is enabled.
  backend: auto
  timeout_s: 10.0                 # Positive finite HTTP timeout, in seconds.
  activity_threshold: 0.7          # Speaker activity threshold, strictly (0, 1).
  silence_duration: 0.6            # Per-speaker silence before finalization (s).
  max_utterance_s: 30.0            # Forced segment boundary; must exceed silence.
