[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-model-server-stack"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["pyyaml>=6.0", "xr-ai-launcher", "xr-ai-logging", "xr-ai-vllm"]

[tool.uv.sources]
xr-ai-launcher = { path = "../xr-ai-launcher", editable = true }
xr-ai-logging = { path = "../xr-ai-logging", editable = true }
xr-ai-vllm = { path = "../xr-ai-vllm", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_model_server_stack"]
