[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-vllm"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
# Stdlib only apart from the stdlib-only launcher (port and ownership helpers).
# Dispatches vLLM hosting to either the pip-installed `vllm` CLI in the caller's
# venv, or the NGC `nvcr.io/nvidia/vllm:<tag>` docker container.  Adding deps
# here would defeat the docker mode (whose point is to avoid pulling vllm into
# the wrapper's venv).
dependencies = ["xr-ai-launcher"]

[tool.uv.sources]
xr-ai-launcher = { path = "../xr-ai-launcher", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_vllm"]
