[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-launcher"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
# Process management depends only on the stdlib-only hardware facts package.
dependencies = ["xr-ai-gpu"]

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_launcher"]

[tool.uv.sources]
xr-ai-gpu = { path = "../xr-ai-gpu", editable = true }
