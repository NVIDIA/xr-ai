[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-launcher"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
# Shared GPU facts and CloudXR integration helpers use only the standard library.
dependencies = ["xr-ai-gpu", "xr-ai-cloudxr"]

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_launcher"]

[tool.uv.sources]
xr-ai-gpu = { path = "../xr-ai-gpu", editable = true }
xr-ai-cloudxr = { path = "../xr-ai-cloudxr", editable = true }
