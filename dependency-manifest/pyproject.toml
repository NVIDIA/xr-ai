# Aggregates every Python project so the committed uv.lock records one fully
# resolved dependency set. Regenerated only during a dependency refresh; see
# DEPENDENCIES.md.

[project]
name = "xr-ai-dependency-manifest"
version = "0.0.0"
description = "Repository-wide resolved dependency manifest."
requires-python = ">=3.11,<3.13"
dependencies = [
    "xr-ai-agent-runtime",
    "xr-ai-hub-client",
    "xr-ai-models[riva]",
    "xr-ai-tools[frames,image-editing,marker-tracking,relay,services,vision]",
    "xr-ai-voice",
    "xr-ai-web-events",
    "xr-ai-launcher",
    "xr-ai-logging",
    "xr-ai-vad",
    "xr-ai-vllm",
    "xr-ai-voicegate",
    "cloudxr-runtime",
    "device-io-hub",
    "embedding-server",
    "llama-nemotron-llm-server",
    "magpie-tts-server",
    "nemotron-omni-llm-server",
    "nemotron3-nano-llm-server",
    "nim-server",
    "piper-tts-server",
    "stt-server",
    "vlm-server",
    "xr-openxr-service",
    "xr-rag-service",
    "xr-video-memory-service",
    "lab-instrument-monitoring",
    "lab-instrument-monitoring-worker",
    "model-servers",
    "simple-vlm-example",
    "simple-vlm-example-worker",
    "tea-making-sample",
    "tea-making-worker",
    "xr-render-demo",
    "xr-render-demo-eval",
    "xr-render-demo-worker",
    "xr-render-scene",
    "xr-ai-tests",
]

[tool.uv]
package = false

# Every source is editable: the projects depend on each other as editable
# paths, and mixing modes resolves to conflicting URLs.
[tool.uv.sources]
xr-ai-agent-runtime              = { path = "../agent-sdk/xr-ai-runtime", editable = true }
xr-ai-hub-client                 = { path = "../agent-sdk/xr-ai-hub", editable = true }
xr-ai-models                     = { path = "../agent-sdk/xr-ai-models", editable = true }
xr-ai-tools                      = { path = "../agent-sdk/xr-ai-tools", editable = true }
xr-ai-voice                      = { path = "../agent-sdk/xr-ai-voice", editable = true }
xr-ai-web-events                 = { path = "../agent-sdk/xr-ai-web-events", editable = true }
xr-ai-launcher                   = { path = "../utils/xr-ai-launcher", editable = true }
xr-ai-logging                    = { path = "../utils/xr-ai-logging", editable = true }
xr-ai-vad                        = { path = "../utils/xr-ai-vad", editable = true }
xr-ai-vllm                       = { path = "../utils/xr-ai-vllm", editable = true }
xr-ai-voicegate                  = { path = "../utils/xr-ai-voicegate", editable = true }
cloudxr-runtime                  = { path = "../services/cloudxr-runtime", editable = true }
device-io-hub                    = { path = "../services/device-io-hub", editable = true }
embedding-server                 = { path = "../services/embedding-server", editable = true }
llama-nemotron-llm-server        = { path = "../services/llama-nemotron-llm", editable = true }
magpie-tts-server                = { path = "../services/magpie-tts", editable = true }
nemotron-omni-llm-server         = { path = "../services/nemotron-omni-llm", editable = true }
nemotron3-nano-llm-server        = { path = "../services/nemotron3-nano-llm", editable = true }
nim-server                       = { path = "../services/nim-server", editable = true }
piper-tts-server                 = { path = "../services/piper-tts", editable = true }
stt-server                       = { path = "../services/stt-server", editable = true }
vlm-server                       = { path = "../services/vlm-server", editable = true }
xr-openxr-service                = { path = "../services/openxr-service", editable = true }
xr-rag-service                   = { path = "../services/rag-service", editable = true }
xr-video-memory-service          = { path = "../services/video-memory-service", editable = true }
lab-instrument-monitoring        = { path = "../agent-samples/lab-instrument-monitoring", editable = true }
lab-instrument-monitoring-worker = { path = "../agent-samples/lab-instrument-monitoring/worker", editable = true }
model-servers                    = { path = "../agent-samples/model-servers", editable = true }
simple-vlm-example               = { path = "../agent-samples/simple-vlm-example", editable = true }
simple-vlm-example-worker        = { path = "../agent-samples/simple-vlm-example/worker", editable = true }
tea-making-sample                = { path = "../agent-samples/tea-making-sample", editable = true }
tea-making-worker                = { path = "../agent-samples/tea-making-sample/worker", editable = true }
xr-render-demo                   = { path = "../agent-samples/xr-render-demo", editable = true }
xr-render-demo-eval              = { path = "../agent-samples/xr-render-demo/eval", editable = true }
xr-render-demo-worker            = { path = "../agent-samples/xr-render-demo/worker", editable = true }
xr-render-scene                  = { path = "../agent-samples/xr-render-demo/scene", editable = true }
xr-ai-tests                      = { path = "../tests", editable = true }
