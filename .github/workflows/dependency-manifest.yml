name: dependency-manifest

# dependency-manifest/ holds the committed, fully resolved dependency set as of
# the last uv.toml cutoff change, so ordinary pull requests never trigger these
# checks; only the cutoff, the manifest, or the files that generate it do. Each
# job regenerates one lock the way DEPENDENCIES.md describes and fails on drift.

on:
  push:
    branches: [main]
    paths:
      - 'uv.toml'
      - 'dependency-manifest/**'
      - '.github/scripts/generate_dependency_map.py'
      - '.github/scripts/generate_dependency_manifest.py'
      - '.github/scripts/refresh_web_lock.sh'
      - '.github/workflows/dependency-manifest.yml'
  pull_request:
    paths:
      - 'uv.toml'
      - 'dependency-manifest/**'
      - '.github/scripts/generate_dependency_map.py'
      - '.github/scripts/generate_dependency_manifest.py'
      - '.github/scripts/refresh_web_lock.sh'
      - '.github/workflows/dependency-manifest.yml'

concurrency:
  group: dependency-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lock:
    name: python lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          # The check re-resolves from every pyproject.toml, so key the cache on
          # those and the shared cutoff rather than the committed lock.
          cache-dependency-glob: |
            **/pyproject.toml
            uv.toml

      - name: Check manifest and Python lockfile
        run: uv run --script .github/scripts/generate_dependency_manifest.py --check

  android-locks:
    name: android lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Regenerate Android lockfiles
        working-directory: client-samples/android
        # Gradle merges into an existing lockfile, so start from none.
        run: |
          rm -f ../../dependency-manifest/android/*.lockfile
          ./gradlew dependencies :app:dependencies --write-locks

      - name: Check committed Android lockfiles
        run: |
          git add --intent-to-add -- dependency-manifest/android
          git diff --exit-code -- dependency-manifest/android

  web-locks:
    name: web-xr lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate web-xr lockfile
        run: .github/scripts/refresh_web_lock.sh

      - name: Check committed web-xr lockfile
        run: |
          git add --intent-to-add -- dependency-manifest/web-xr-build
          git diff --exit-code -- dependency-manifest/web-xr-build
