name: tests

# Runs the IPC + multi-client / multi-agent suite under tests/.
# The suite is hub-on-loopback only — it does not need Docker, LiveKit,
# or NVENC, so it runs cleanly on a stock ubuntu-latest runner.
# Integration tests under -m integration are auto-skipped because no hub
# is started here.

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same ref when a new commit arrives.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            tests/pyproject.toml
            tests/uv.lock
            agent-sdk/xr-ai-hub/pyproject.toml
            services/xr-media-hub/pyproject.toml

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # nltk >= 3.10.1 refuses any import it initiates whose module resolves under
      # the working directory. pytest runs from tests/, so a venv at tests/.venv
      # puts nltk's own copy of regex there and the pipecat -> nltk -> regex chain
      # fails. Keep the venv at the repo root: still inside the checkout, so every
      # editable path and subprocess keeps working, but no longer under cwd.
      - name: Sync test workspace
        working-directory: tests
        env:
          UV_PROJECT_ENVIRONMENT: ../.venv
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        working-directory: tests
        env:
          UV_PROJECT_ENVIRONMENT: ../.venv
        run: uv run pytest -v --tb=short --color=yes -m "not gpu"
