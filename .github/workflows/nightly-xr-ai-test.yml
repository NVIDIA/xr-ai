name: nightly XR AI test

# Runs the `gpu`-marked pytest suite on a self-hosted GPU runner — these
# tests need real GPU / Docker / NVENC hardware, so they're filtered out of
# the default `tests` workflow (ubuntu-latest). Mirrors the local
# `tests/run_local_gpu_tests.sh` entry point.
#
# Setup note: the GPU runner's Docker needs the NVIDIA runtime registered
# (`sudo nvidia-ctk runtime configure --runtime=docker`); without it the
# vLLM tests fail at container launch.

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daily
  workflow_dispatch:
  # Also fire on PRs that edit this workflow itself, so changes to the
  # CI definition get exercised end-to-end against the GPU runner before
  # merge.
  pull_request:
    paths:
      - .github/workflows/nightly-xr-ai-test.yml

# Queue overlapping runs instead of cancelling; the previous nightly
# may still be running when the next cron fires on a busy GPU host.
concurrency:
  group: nightly-xr-ai-test
  cancel-in-progress: false

# Least-privilege default for every job; `notify` overrides with
# `issues: write` for the tracking-issue step.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (gpu)
    runs-on: gpu
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover CUDA toolkit
        # Prefer CUDA 13.0 (current target), but fall back through the
        # usual symlinks and finally whatever `nvcc` is on PATH so we
        # don't pin the workflow to a single host layout.
        run: |
          set -euo pipefail
          candidates=(
            "/usr/local/cuda-13.0"
            "/usr/local/cuda-13"
            "/usr/local/cuda"
            "${CUDA_HOME:-}"
          )
          for c in "${candidates[@]}"; do
            [[ -z "$c" ]] && continue
            if [[ -x "$c/bin/nvcc" ]]; then
              echo "Selected CUDA toolkit: $c"
              echo "CUDA_HOME=$c"             >> "$GITHUB_ENV"
              # CUDACXX is the env var FlashInfer / torch.cpp_extension /
              # cmake all honor. Setting it explicitly stops downstream
              # JIT compilers from guessing (and previously baking the
              # wrong absolute path into build.ninja).
              echo "CUDACXX=$c/bin/nvcc"      >> "$GITHUB_ENV"
              echo "$c/bin"                   >> "$GITHUB_PATH"
              exit 0
            fi
          done
          if nvcc_path="$(command -v nvcc)"; then
            cuda_home="$(dirname "$(dirname "$nvcc_path")")"
            echo "Selected CUDA toolkit (from PATH): $cuda_home"
            echo "CUDA_HOME=$cuda_home"       >> "$GITHUB_ENV"
            echo "CUDACXX=$nvcc_path"         >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::No CUDA toolkit found in candidates or on PATH"
          exit 1

      - name: Check CUDA compiler
        run: |
          which nvcc
          nvcc --version
          nvcc --list-gpu-arch | grep compute_89

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            tests/pyproject.toml
            tests/uv.lock
            agent-sdk/xr-ai-hub/pyproject.toml
            services/xr-media-hub/pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync test workspace
        working-directory: tests
        run: uv sync --python 3.12

      - name: Pre-warm magpie TTS venv
        # The magpie venv is not part of the main `tests/` workspace — it
        # lives under services/magpie-tts and is only synced lazily inside
        # the test.  Pre-warm here so that (a) the ~1 GB NeMo install doesn't
        # count against the 900 s port-open timeout inside the test, and (b)
        # failures during install produce a named step, not a cryptic "exited
        # with code 1" from inside the test.
        run: |
          set -euo pipefail
          uv sync --directory services/magpie-tts

      - name: Pre-pull Cosmos3 vLLM image
        # The public NVIDIA vLLM image supports anonymous pulls. Pull it in a
        # named step so a cold runner does not spend the GPU test's startup
        # budget downloading the new Cosmos3-capable runtime.
        run: docker pull nvcr.io/nvidia/vllm:26.07-py3

      - name: Purge leftover xr-ai-vllm containers (pre)
        # Containers are named `xr-ai-vllm-*` by the vLLM launcher. On a
        # persistent self-hosted runner these can survive a previous run
        # — most commonly the `test_nemotron3_nano_persistent` test,
        # which intentionally leaves a long-lived vLLM container — and
        # squat on GPU memory before this run's first test even starts.
        # Wipe them, then assert we have most of the GPU back.
        run: |
          set -euo pipefail
          leftovers=$(docker ps -aq --filter 'name=^xr-ai-vllm-' || true)
          if [ -n "$leftovers" ]; then
            echo "Removing leftover containers:"
            docker ps -a --filter 'name=^xr-ai-vllm-' --format '  {{.Names}} ({{.Status}})'
            docker rm -f $leftovers
          else
            echo "No leftover xr-ai-vllm-* containers."
          fi
          echo "--- nvidia-smi free memory ---"
          nvidia-smi --query-gpu=index,name,memory.free,memory.total \
                     --format=csv,noheader
          # Fail fast if something else is holding the GPU — better a
          # clear error here than a confusing OOM from vLLM later.
          free_mib=$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | head -n1)
          if [ "${free_mib:-0}" -lt 30000 ]; then
            echo "::error::Only ${free_mib} MiB free on GPU 0 — expected >=30000 MiB after purge"
            nvidia-smi
            exit 1
          fi

      - name: Run gpu-marked tests
        working-directory: tests
        # Per-test wall-clock guard so one hung test fails with a traceback
        # instead of burning the 60-min job cap as a silent cancel. signal
        # method interrupts blocked reads (thread method can't); 1200s > the
        # 900s cold-start budget. pytest-timeout layered CI-only via --with
        # to keep it out of tests/pyproject.toml + uv.lock + DEPENDENCIES.md.
        run: >-
          uv run --with pytest-timeout pytest -v --tb=short --color=yes -m gpu
          --timeout=1200 --timeout-method=signal

      - name: Purge xr-ai-vllm containers (post)
        # Always-run cleanup so a failed test (or a cancelled job) does
        # not leak GPU memory into the next nightly run.
        if: always()
        run: |
          set -u
          leftovers=$(docker ps -aq --filter 'name=^xr-ai-vllm-' || true)
          if [ -n "$leftovers" ]; then
            echo "Removing containers left running after tests:"
            docker ps -a --filter 'name=^xr-ai-vllm-' --format '  {{.Names}} ({{.Status}})'
            docker rm -f $leftovers || true
          else
            echo "No xr-ai-vllm-* containers to remove."
          fi

  notify:
    name: alert on failure
    needs: [pytest]
    # Fire when the pytest job failed OR was cancelled so a broken
    # nightly is visible without anyone polling the Actions tab. A
    # timeout-minutes hit concludes as `cancelled`, not `failure`, so
    # failure() alone would silently skip the alert on the most important
    # case. Skip on PRs — those are pre-merge dry-runs, not the nightly.
    #
    # always() is required here: without it GitHub skips this job entirely
    # when a needs job fails, before ever evaluating the if expression.
    if: >-
      always()
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        # Update-don't-stack: comment on the open tracking issue if one
        # exists, otherwise open a fresh one. One issue accumulates the
        # run links until someone fixes it and closes it.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="nightly-failure"
          TITLE="Nightly XR AI test is failing"
          gh label create "$LABEL" --color B60205 \
            --description "Automated nightly GPU test failures" 2>/dev/null || true
          body=$(printf 'Nightly run **failed** (event: %s, commit \x60%s\x60).\n\n- Run: %s' \
            "$EVENT_NAME" "${COMMIT_SHA:0:7}" "$RUN_URL")
          existing=$(gh issue list --state open --label "$LABEL" \
            --json number --jq '.[0].number' || true)
          if [[ -n "$existing" ]]; then
            echo "Commenting on existing issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            echo "Opening new tracking issue"
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi
