name: lint

# First-cut ruff lint, governed by the root `ruff.toml` (E,F,W,I; line-length
# 120; pre-existing violations grandfathered via per-file-ignores). This is
# check-only — it does NOT run `ruff format`. Repo-wide formatting is a
# separate human-gated decision (touches every file); enable it in a follow-up
# once the format commit lands.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && contains(github.event.pull_request.labels.*.name, 'ci:self-hosted') && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for merge conflict markers
        # "=======" alone is a legitimate RST/Markdown underline; only the
        # arrow markers are unambiguous.
        run: |
          if git grep -nE '^(<{7}|>{7})( |$)' -- ':!*.lock'; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.16
          args: check .
