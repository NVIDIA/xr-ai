# Oracles describe the drawing, not a model's prior responses. Only pixels and
# the test guide's question reach the configured VLM; these expectations never do.
guides_dir: fixtures
guide: Chamomile Evaluation
scenes_file: tea_scenes.yaml
cases:
  - {scene: breakfast, step: identify, answer: 'NO', accept: false}
  - {scene: green, step: identify, answer: 'NO', accept: false}
  - {scene: chamomile, step: identify, answer: 'YES', accept: true}
  - {scene: mint, step: identify, answer: 'NO', accept: false}
  - {scene: other_blend, step: identify, answer: 'NO', accept: false}
  - {scene: partial_blend, step: identify, answer: 'NO', accept: false}
  - {scene: covered_packet, step: identify, answer: UNKNOWN, accept: false}
  - {scene: current20, step: heat_water, answer: 'CURRENT\s*\|\s*20(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: current65, step: heat_water, answer: 'CURRENT\s*\|\s*65(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: current94, step: heat_water, answer: 'CURRENT\s*\|\s*94(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: current99, step: heat_water, answer: 'CURRENT\s*\|\s*99(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: current100, step: heat_water, answer: 'CURRENT\s*\|\s*100(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: true}
  - {scene: actual212, step: heat_water, answer: 'ACTUAL\s*\|\s*212(?:\.0+)?\s*(?:(?:°\s*)?F|℉)', accept: true}
  - {scene: current100f, step: heat_water, answer: 'CURRENT\s*\|\s*100(?:\.0+)?\s*(?:(?:°\s*)?F|℉)', accept: false}
  - {scene: target100, step: heat_water, answer: 'TARGET\s*\|\s*100(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: set100, step: heat_water, answer: 'SET\s*\|\s*100(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: unlabeled100, step: heat_water, answer: UNKNOWN, accept: false}
  - {scene: mixed94, step: heat_water, answer: 'CURRENT\s*\|\s*94(?:\.0+)?\s*(?:(?:°\s*)?C|℃)', accept: false}
  - {scene: empty, step: start_steeping, answer: 'NO', accept: false}
  - {scene: dry_bag, step: start_steeping, answer: 'NO', accept: false}
  - {scene: water, step: start_steeping, answer: 'NO', accept: false}
  - {scene: above, step: start_steeping, answer: 'NO', accept: false}
  - {scene: immersed, step: start_steeping, answer: 'YES', accept: true}
  - {scene: floating, step: start_steeping, answer: 'YES', accept: true}
  - {scene: obscured, step: start_steeping, answer: UNKNOWN, accept: false}
