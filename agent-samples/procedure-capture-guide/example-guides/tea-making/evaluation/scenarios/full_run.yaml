# Evaluation scenario for run_scenario.py, not a procedure guide definition.
# Follow the successful path through the five-minute timer, restart, and stop.
# This runs independently so a failure in the step-verification scenario
# cannot hide timer and lifecycle coverage.
guide_path: ../../guide.yaml
fail_fast: true
scenes_file: ../fixtures/image_scenes.yaml
actions:
  - {action: image, scene: chamomile}
  - {action: say, text: 'What is my status?', expect: inactive, tools: [workflow__status]}
  - {action: say, text: Start guide, expect: Show the tea packet, tools: [workflow__restart]}
  - {action: wait_speech, expect: The packet identifies chamomile}
  - {action: say, text: 'What is my status?', expect: 'Read the tea packet\. Complete', tools: [workflow__status]}
  - {action: image, scene: current100}
  - {action: say, text: Next, expect: Heat fresh water, tools: [workflow__advance], arguments: [{skip: false}]}
  - {action: wait_speech, expect: The display shows the brewing target temperature}
  - {action: image, scene: immersed}
  - {action: say, text: Next, expect: Carefully put the chamomile, tools: [workflow__advance], arguments: [{skip: false}]}
  - {action: wait_speech, expect: The tea bag is visibly in the water}
  - {action: say, text: Next, expect: five-minute steeping timer is now running, tools: [workflow__advance], arguments: [{skip: false}]}
  - {action: say, text: 'How much time remains?', tools: [clock__timer], arguments: [{}]}
  - {action: say, text: Next, expect: not complete, tools: [workflow__advance], arguments: [{skip: false}]}
  # Delivery time is slightly later than timer entry; allow five seconds of
  # speech scheduling tolerance, without shortening the runtime's 300-second timer.
  - action: wait_speech
    expect: Five minutes have elapsed
    after_speech: five-minute steeping timer is now running
    minimum_elapsed_s: 295
    timeout_s: 330
  - {action: say, text: 'What is my status?', expect: inactive, tools: [workflow__status]}
  - {action: image, scene: breakfast}
  - {action: say, text: Start guide, expect: Show the tea packet, tools: [workflow__restart]}
  - {action: say, text: Stop guide, expect: Guide stopped, tools: [workflow__reset]}
  - {action: image, scene: chamomile}
  - {action: quiet, duration_s: 10}
  - {action: say, text: 'What is my status?', expect: inactive, tools: [workflow__status]}
