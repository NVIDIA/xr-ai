# Expected answers for isolated visual checks and multi-turn observations.
# This is evaluation input, not a procedure guide. Oracles describe the drawing,
# not a model's prior responses. Only pixels and
# the shipped guide's question reach the configured VLM; these expectations never do.
guide_path: ../../guide.yaml
scenes_file: image_scenes.yaml
cases:
  - {scene: breakfast, step: identify, answer: .*breakfast.*black.*, accept: false}
  - {scene: green, step: identify, answer: .*green.*, accept: false}
  - {scene: chamomile, step: identify, answer: .*chamomile.*, accept: true}
  - {scene: mint, step: identify, answer: .*mint.*, accept: false}
  - {scene: other_blend, step: identify, answer: .*ginger.*, accept: false}
  - {scene: partial_blend, step: identify, answer: .*\bchamo\b.*, accept: false}
  - {scene: covered_packet, step: identify, answer: .*(obscur|cover|hidden|unread|cannot).*, accept: false}
  - {scene: current20, step: heat_water, answer: "(?=.*\\bcurrent\\b)(?=.*\\b20(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: false}
  - {scene: current65, step: heat_water, answer: "(?=.*\\bcurrent\\b)(?=.*\\b65(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: false}
  - {scene: current94, step: heat_water, answer: "(?=.*\\bcurrent\\b)(?=.*\\b94(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: false}
  - {scene: current99, step: heat_water, answer: "(?=.*\\bcurrent\\b)(?=.*\\b99(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: false}
  - {scene: current100, step: heat_water, answer: "(?=.*\\bcurrent\\b)(?=.*\\b100(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: true}
  - {scene: actual212, step: heat_water, answer: "(?=.*\\bactual\\b)(?=.*\\b212(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:F|\u2109)).*", accept: true}
  - {scene: current100f, step: heat_water, answer: "(?=.*\\bcurrent\\b)(?=.*\\b100(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:F|\u2109)).*", accept: false}
  - {scene: target100, step: heat_water, answer: "(?=.*\\btarget\\b)(?=.*\\b100(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: false}
  - {scene: set100, step: heat_water, answer: "(?=.*\\bset\\b)(?=.*\\b100(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:C|\u2103)).*", accept: false}
  - {scene: unlabeled100, step: heat_water, answer: .*100.*, accept: false}
  - {scene: mixed94, step: heat_water, answer: ".*current.*\\b94(?:\\.0+)?\\s*(?:\xB0\\s*)?(?:[CF]|\u2103|\u2109).*", accept: false}
  - {scene: empty, step: start_steeping, answer: .*(empty|no water|no liquid|dry).*, accept: false}
  - {scene: dry_bag, step: start_steeping, answer: .*(dry|empty|no water|no liquid).*, accept: false}
  - {scene: water, step: start_steeping, answer: .*(water|liquid).*, accept: false}
  - {scene: above, step: start_steeping, answer: .*(above|out of|not.*contact|suspend).*, accept: false}
  - {scene: immersed, step: start_steeping, answer: .*(immers|submer|in.*water|in.*liquid).*, accept: true}
  - {scene: floating, step: start_steeping, answer: .*(float|surface|contact).*, accept: true}
  - {scene: obscured, step: start_steeping, answer: .*(obscur|cover|hidden|cannot).*, accept: false}
