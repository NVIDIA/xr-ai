# Brewing reference: ../../../tea-making-sample/rag-documents/tea-brewing.md
# Chamomile uses 100 C / 212 F water and a 5–7 minute steep; choose five minutes.
schema_version: 1
task:
  id: tea_making
  name: Tea Making
  version: 6
  status: approved
  start_step: identify
  foreground_prompt: >-
    Guide brewing chamomile tea. Accept any tea packet or box with the word
    chamomile visibly printed on it, regardless of brand or blend. This recipe
    follows the tea sample's brewing reference: boiling water, verified here by
    a visible temperature reading of 100 C or 212 F, and a five-minute steep selected
    from its 5–7 minute range. Do not silently change the recipe. If the package
    instructions require different brewing settings, or local boiling temperature
    cannot reach this display target, stop and adapt the guide rather than
    bypass verification.
    Use a stable heat-safe vessel and follow appliance instructions. Keep hands
    clear of hot water and steam; never ask the user to tilt a hot vessel for
    the camera. Visual judgments do not guarantee safety. No retrieval or
    temperature-conversion tools are available. Say next advances a verified
    visual step. The timer starts only on entering the fourth step, not when
    immersion is first detected. When the timer expires the run ends automatically;
    no next command is needed to finish. Skipping the temperature check continues
    to tea immersion and the timer, leaving temperature unverified.
    Start guide begins a fresh run.
  complete_message: Five minutes have elapsed. Your chamomile tea guide is complete. Carefully remove the tea bag and let the drink cool before tasting.

state:
  tea_identified:
    type: boolean
    description: The word chamomile is visible on the tea packet or box.
    initial: false
  water_at_target:
    type: boolean
    description: A visible temperature display shows 100 C or 212 F.
    initial: false
  tea_immersed:
    type: boolean
    description: The tea bag visibly contacts water inside the same vessel.
    initial: false
  steeping_complete:
    type: boolean
    description: The runtime-owned five-minute steeping timer has expired.
    initial: false

steps:
  - id: identify
    title: Read the tea packet
    reads: []
    writes: [tea_identified]
    trigger:
      function: current_view
      interval_s: 1.5
      arguments:
        question: >-
          Focus on the printed tea-name area of the packet or box. Copy the
          legible words of the name and blend exactly. Describe text hidden by
          fingers, blur, or glare, and state if no package or readable name is
          visible. Report words rather than inferring a tea from colors or
          illustrations.
      result_field: text
    evidence:
      condition: >-
        The complete word CHAMOMILE is visibly readable as part of the tea name on the
        package. Case and brand do not matter; a partial word does not establish the tea name.
      consecutive: 2
      commit: {tea_identified: true}
    voice:
      prompt: >-
        Ask to see the tea packet or box so the word chamomile is legible.
        Accept chamomile alone or as part of a blend name from any brand.
        Use current_view for label questions. Do not say the package is verified
        based on a user assertion. The fixed recipe is boiling water and five
        minutes; stop and adapt the guide if the package specifies different
        brewing settings.
      tools: [current_view]
    complete_when: {tea_identified: true}
    next: heat_water
    complete_on_skip: true
    messages:
      enter: Show the tea packet or box so I can read the word chamomile.
      complete: The packet identifies chamomile tea. Say next to check the water temperature.
      skip: Packet verification skipped; ending this run rather than choosing an unverified tea.

  - id: heat_water
    title: Verify the brewing temperature
    reads: []
    writes: [water_at_target]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          Focus on the temperature display. Copy the visible numbers and their
          temperature units exactly, pairing each value with its unit. Include
          labels when present and report unreadable or missing digits or units.
          Do not convert units or infer a reading from steam, lights, or expected
          settings. Describe the display rather than judging brewing readiness.
      result_field: text
    evidence:
      condition: >-
        The display visibly contains at least one complete number-and-unit pair:
        100 C (100 degrees Celsius) or 212 F (212 degrees Fahrenheit).
        Both the number and its temperature unit must be explicitly readable;
        100 alone without a unit is insufficient. Any label or absent label is
        accepted, including TARGET or SET, and no probe is required. Other
        displayed readings do not invalidate a qualifying pair. The desired
        temperature mentioned without a matching visible reading is insufficient.
      consecutive: 2
      commit: {water_at_target: true}
    voice:
      prompt: >-
        Ask for boiling water and a safely visible temperature display of 100 C
        or 212 F. Use current_view to read it. No CURRENT or ACTUAL label or
        thermometer probe is required; the check accepts any visible display
        reading with the qualifying value and unit. Do not infer the reading
        from steam or an elapsed-time estimate. If the user skips this check,
        continue to tea immersion and then the timer without claiming the
        temperature was verified. Never direct heating an empty vessel,
        overfilling, or defeating an appliance's controls to reach a reading.
      tools: [current_view]
    complete_when: {water_at_target: true}
    next: start_steeping
    complete_on_skip: false
    messages:
      enter: Heat fresh water according to your appliance instructions. Show a temperature reading of 100 degrees Celsius or 212 Fahrenheit.
      complete: The display shows the brewing target temperature. Say next to put the tea in the water.
      skip: Temperature verification skipped; continuing without verifying the water temperature.

  - id: start_steeping
    title: Put the tea in water
    reads: []
    writes: [tea_immersed]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          Focus inside the vessel and on the tea bag. Describe the visible
          contents first: liquid surface, empty interior, or obscured contents.
          Then describe the bag location and its visible contact with those
          contents, distinguishing above, beside, touching the surface, or
          immersed. Do not infer liquid from the vessel outline or a string.
      result_field: text
    evidence:
      condition: >-
        Visible water and the tea bag are in contact inside the same vessel. A floating bag
        touching the water counts. A dry bag in an empty vessel, a bag above or beside water,
        a string alone, or obscured liquid or contact does not establish this condition.
      consecutive: 2
      commit: {tea_immersed: true}
    voice:
      prompt: >-
        Guide placing the tea bag in the prepared water safely. Use current_view
        for visual checks. The timer is not running in this step. After verified
        immersion ask the user to say next promptly to enter the timer step.
        Never claim that immersion itself started the timer.
      tools: [current_view]
    complete_when: {tea_immersed: true}
    next: steep_timer
    complete_on_skip: true
    messages:
      enter: Carefully put the chamomile tea bag in the prepared water, keeping the vessel stable.
      complete: The tea bag is visibly in the water. Say next now to start the five-minute steeping timer.
      skip: Immersion verification and the timer were skipped; this run is not a verified completion.

  - id: steep_timer
    title: Start the steeping timer
    reads: []
    writes: [steeping_complete]
    trigger:
      function: clock__timer
      interval_s: 1
      arguments:
        duration_s: 300
      result_field: expired
    evidence:
      pattern: '^true$'
      consecutive: 1
      commit: {steeping_complete: true}
    voice:
      prompt: >-
        Call clock__timer with no arguments for elapsed-time, remaining-time,
        or timer-completion questions. Use its fresh result, not the tea color,
        a guessed start timestamp, or a user's estimate. This five-minute timer
        starts on entry to this step. When it expires the guide ends automatically;
        do not ask the user to say next to finish. Stop guide cancels the run.
        The timer cannot verify continued tea immersion throughout the wait.
      tools: [clock__timer]
    complete_when: {steeping_complete: true}
    next: null
    finish_on_complete: true
    messages:
      enter: The five-minute steeping timer is now running. I will let you know when the guide is finished.
      complete: Five minutes have elapsed. The guide is complete; carefully remove the tea bag.
      skip: Timer skipped; the full steeping duration was not verified.
