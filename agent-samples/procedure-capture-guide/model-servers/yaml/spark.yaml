# Explicit KV bytes reserve the captioning cache; utilization controls admission.
stt:
  cuda_visible_devices: '0'
tts:
  cuda_visible_devices: '0'
omni:
  max_model_len: 32768
  video_num_frames: 64
  max_num_seqs: 4
  gpu_memory_utilization: 0.25
  kv_cache_memory_bytes: 2147483648
  spark_uma: true
vlm:
  enforce_eager: true
  gpu_memory_utilization: 0.2
  kv_cache_memory_bytes: 1610612736
  max_num_seqs: 4
  spark_uma: true
