# Explicit KV bytes reserve the captioning cache; utilization controls admission.
stt:
  cuda_visible_devices: '0'
tts:
  cuda_visible_devices: '0'
omni:
  max_num_seqs: 8
  gpu_memory_utilization: 0.35
  kv_cache_memory_bytes: 2147483648
vlm:
  gpu_memory_utilization: 0.23
  kv_cache_memory_bytes: 1610612736
  max_num_seqs: 4

# CLEF uses the shared service defaults on GPU 0.
clef: {}
