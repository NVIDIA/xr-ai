# Separate STT from the VLM; explicit KV bytes reserve the captioning cache.
stt:
  cuda_visible_devices: '1'
tts:
  cuda_visible_devices: '0'
omni:
  cuda_visible_devices: '1'
  max_num_seqs: 8
  gpu_memory_utilization: 0.78
  kv_cache_memory_bytes: 2147483648
vlm:
  cuda_visible_devices: '0'
  gpu_memory_utilization: 0.47
  kv_cache_memory_bytes: 1610612736

# CLEF uses the shared service defaults on GPU 0.
clef: {}
