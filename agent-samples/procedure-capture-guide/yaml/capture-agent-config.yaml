# Capture policy; voice and frame infrastructure settings live in worker.yaml.
# Paths are relative to this YAML. --output-root overrides artifacts_dir.
# Packets are written under artifacts_dir/sessions/.
artifacts_dir: ../artifacts
capture_fps: 2.0
caption_interval_s: 5.0

# Monitor received media, not the intentionally sampled snapshot/caption rate.
# Warnings never stop capture or change camera mode. Missing telemetry is unknown.
quality:
  enabled: true
  window_s: 5
  degrade_s: 5
  recover_s: 10
  stall_s: 3
  telemetry_ttl_s: 4
  cooldown_s: 30
  reminder_s: 60
  warning_ttl_s: 15
  min_short_edge: 480
  drop_ratio: 0.5
