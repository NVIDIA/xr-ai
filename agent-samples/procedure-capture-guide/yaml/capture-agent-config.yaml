# Capture policy; voice and frame infrastructure settings live in worker.yaml.
# Paths are relative to this YAML. --output-root overrides artifacts_dir.
# Packets are written under artifacts_dir/sessions/.
artifacts_dir: ../artifacts
capture_fps: 2.0
caption_interval_s: 5.0

# Video checks use existing frame metadata, never models or camera requests.
# No observed frames means unavailable measurements. Notifications never stop capture.
quality:
  enabled: true
  repeat_interval_s: 10  # Minimum seconds between alerts for the SAME condition.
  poll_interval_s: 1     # Conditions due on the same tick share one announcement.
  window_s: 5
  stall_s: 3
  min_short_edge: 480
  drop_ratio: 0.5
