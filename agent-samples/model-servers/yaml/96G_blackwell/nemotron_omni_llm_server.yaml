# Nemotron-3-Nano-Omni — single Blackwell 96 GB.
# NVFP4 is selected automatically. The allocation leaves room for Cosmos, STT,
# embeddings, rendering, and runtime overhead.

host: "0.0.0.0"
port: 8108
hf_token: ""
model_cache: ../../../../models

max_num_seqs: 8
tensor_parallel_size: 1
max_model_len: 32768
gpu_memory_utilization: 0.35
enforce_eager: false

video_pruning_rate: 0.5
video_fps: 2
video_num_frames: 64

vllm_backend: docker
vllm_image: vllm/vllm-openai:v0.20.0
extra_pip: []
