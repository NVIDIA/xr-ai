# Nemotron-3-Nano-Omni — dual 48 GB Ada configuration.
# Cosmos remains on GPU 0; FP8 Omni replaces Nano on GPU 1 beside STT.

host: "0.0.0.0"
port: 8108
gpu_memory_reservation_gib: 37.0
hf_token: ""
model_cache: ../../../../models

cuda_visible_devices: "1"
max_num_seqs: 8
tensor_parallel_size: 1
max_model_len: 32768
enforce_eager: false

video_pruning_rate: 0.5
video_fps: 2
video_num_frames: 64

vllm_backend: docker
vllm_image: vllm/vllm-openai:v0.20.0
extra_pip: []
