# Final transcripts during an active conversation are recorded before any
# optional wake gate. Only accepted turns reach the foreground agent.
magic_phrases:
  - agent
  - hey agent
listening_chime: true
followup_grace_s: 5.0

# Start once, then speak naturally until the full stop phrase.
conversation:
  enabled: true
  start_phrase: "Hey agent, let's start talking"
  stop_phrase: "Hey agent, let's stop talking"
  require_wake_phrase: false  # true keeps magic_phrases and followup_grace_s
  phrase_window_s: 6.0
