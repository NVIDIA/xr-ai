# xr-render-demo worker configuration.
# Paths resolve relative to this file's directory.

# ── AI model services ─────────────────────────────────────────────────────────
# Model backend, per role (stt, tts, llm, vlm). Role `llm` covers both the
# reactive llm and agent_llm model entries. Values:
#   local     — the role's local model-server; entry read from models_yaml (default)
#   nim       — hosted NVIDIA NIM (build.nvidia.com); no local server; entry
#               read from models.nim.yaml
#   nim_local — self-hosted NIM container pulled from NGC via nim-server
#               (yaml/nim_<role>_server.yaml); entry read from
#               models.nim_local.yaml; requires docker
# A scalar applies to every role, except that scalar `nim` keeps stt/tts
# local (hosted NIM speech is not OpenAI /v1/audio-compatible), so
# `model_backend: nim` hosts the LLMs and VLM and still runs local speech.
# The map form sets roles individually; the optional `default` key covers
# unlisted roles (local when absent):
#   model_backend:
#     default: nim_local
#     tts: local
# nim and nim_local require NGC_API_KEY (see docs/credentials.md). This is
# the ONLY change needed to switch (no main.py edit).
model_backend: local

# Model endpoints (URLs, presets, timeouts) are declared in models.yaml and
# loaded via xr-ai-models.  Edit that file to change which model runs where.
# Path is resolved relative to THIS file's directory (`yaml/`), so the bare
# `models.yaml` here points at `agent-samples/xr-render-demo/yaml/models.yaml`.
# Used for roles with backend `local`.
models_yaml: models.yaml

# ── Voice gate ────────────────────────────────────────────────────────────────
# Magic-phrase opt-in gate; see voice_gate.yaml for the schema.  Ships with
# `magic_phrases: []` (always-on) to preserve the pre-migration behavior;
# operators populate the list to enable wake-word gating.
voice_gate_yaml: voice_gate.yaml

# ── Native capability services ───────────────────────────────────────────────
scene_endpoint: tcp://127.0.0.1:8320
openxr_endpoint: tcp://127.0.0.1:8330
video_memory_endpoint: tcp://127.0.0.1:8310
text_memory_dir: /dev/shm/xr-ai/text-memory

# ── Voice activity detection (Silero VAD, ONNX backend) ──────────────────────
# silence_duration: seconds of trailing silence that ends an utterance.
# min_speech: minimum cumulative speech before STT fires (filters short blips).
# silero_threshold: speech-probability gate (0..1). Lower = more sensitive
#   (catches quieter/faster speech). Default 0.5 often misses the onset of a
#   word; 0.3 captures it earlier.
silence_duration:  0.8
min_speech:        0.15
silero_threshold:  0.3

# ── Idle timeout ──────────────────────────────────────────────────────────
# Auto-cancel the voice pipeline after this many seconds with no user/bot
# speech. DISABLED by default (0 = off) — a quiet session stays connected
# indefinitely, which is what XR sessions usually want. Set a positive value
# (e.g. 300 for 5 min) to opt in; the worker then tears the pipeline down
# after that long idle. VoiceAgent owns the timeout.
idle_timeout_secs: 0
