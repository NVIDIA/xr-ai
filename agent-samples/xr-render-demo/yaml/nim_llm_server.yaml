# Self-hosted NIM: LLM (serves both the `llm` and `agent_llm` entries in
# models.nim_local.yaml). Nemotron-3-Nano is the same agent model the local
# backend runs; its A3B MoE decode is fast enough to cover the reactive
# entry too. Swap in any LLM NIM from https://catalog.ngc.nvidia.com;
# :latest tracks the newest release.
image:     nvcr.io/nim/nvidia/nemotron-3-nano:latest
http_port: 8106

# Repo-root models/ (resolved relative to this file).
nim_cache: ../../../models/nim

# GPU 1 alone; the VLM shares GPU 0 with CloudXR + LOVR. Adjust per box;
# see docs/ai-services.md.
cuda_visible_devices: "1"

env:
  # 8192 starves the agentic loop (tool schemas alone are ~7k tokens).
  NIM_MAX_MODEL_LEN: "32768"
  # Fraction of total GPU memory despite the PERCENT name (0..1].
  NIM_KVCACHE_PERCENT: "0.8"
  # Same vLLM flags the local nemotron3_nano server uses: the agentic loop
  # needs tool calling, and the reasoning parser keeps <think> out of
  # message.content so TTS never reads the chain of thought aloud.
  NIM_PASSTHROUGH_ARGS: "--enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3"
