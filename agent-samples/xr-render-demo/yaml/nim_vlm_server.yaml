# Self-hosted NIM: VLM, the same Cosmos model the local backend's vlm-server
# runs. Swap in any vision NIM from https://catalog.ngc.nvidia.com, but check
# its engine accepts a full image prompt: the nemotron-nano-vl NIM builds a
# 3200-token input cap on this class of GPU, below its own ~3330-token
# per-image cost, so every image request 500s.
image:     nvcr.io/nim/nvidia/cosmos-reason1-7b:latest
http_port: 8100

# Repo-root models/ (resolved relative to this file).
nim_cache: ../../../models/nim

# GPU 0 with CloudXR + LOVR + local speech (~6 GB): Cosmos does not fit
# next to the LLM NIM on one 48 GB GPU (nemotron's weights + KV pool leave
# no room; Cosmos needs ~16 GB of weights before KV). If GPU 0 hosts speech
# NIMs instead, move this to GPU 1 and shrink both KV bounds. Adjust per
# box; see docs/ai-services.md.
cuda_visible_devices: "0"

env:
  NIM_MAX_MODEL_LEN: "16384"
  # Fraction of total GPU memory despite the PERCENT name (0..1]; leaves
  # headroom for the CloudXR stack sharing the GPU.
  NIM_KVCACHE_PERCENT: "0.7"
