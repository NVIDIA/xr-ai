# Self-hosted NIM backend for xr-render-demo — every model (LLMs, VLM, STT,
# TTS) runs in a NIM container on this machine, pulled from nvcr.io and
# serving the optimized NGC engine.
#
# To activate, set ONE key in xr_render_demo_worker.yaml:
#   model_backend: nim_local
# The orchestrator then launches the NIM containers (yaml/nim_*_server.yaml)
# instead of the local model servers. Requires NGC_API_KEY (nvcr.io pull +
# engine download) and GPU capacity for all four containers — see the
# cuda_visible_devices placement in the nim_*_server.yaml files. First start
# per container downloads a multi-GB engine from NGC. Full guide:
# docs/ai-services.md "Self-hosted NIM containers".
#
# The images and model ids below are examples validated against the NGC
# catalog on 2026-07-17; swap in any NIM from https://catalog.ngc.nvidia.com.
# model_name must match what the NIM serves in /v1/models (the image's model
# id). The agentic loop is tuned for the local Nemotron stack; a hosted model
# that supports tool calling gives the closest behaviour.
#
# Per-model mixing: use the map form of model_backend (e.g.
# `model_backend: {vlm: nim_local}`); roles left `local` read their entries
# from models_yaml, so only the containers you list are launched.

# Fast reactive model (quick-ack / still-working) and the agentic
# tool-calling loop: one Nemotron-3-Nano NIM serves both entries. It is the
# same agent model the local backend runs; A3B MoE decode keeps the
# reactive path fast.
llm:
  kind:        openai_compat
  category:    llm
  base_url:    http://localhost:8106
  model_name:  nvidia/nemotron-3-nano
  health_check: false   # NIM health is /v1/health/ready, not /health
  # The NIM's chat template defaults thinking ON (local vLLM defaults off);
  # pin it off so non-thinking calls fit their token budgets. Per-call
  # enable_thinking=True still overrides via the nested extras merge.
  default_extras:
    chat_template_kwargs:
      enable_thinking: false

agent_llm:
  kind:        openai_compat
  category:    llm
  base_url:    http://localhost:8106
  model_name:  nvidia/nemotron-3-nano
  health_check: false
  default_extras:
    chat_template_kwargs:
      enable_thinking: false
  capabilities:
    tool_calls: true

# Visual question answering used by native vision functions.
vlm:
  kind:        openai_compat
  category:    vlm
  base_url:    http://localhost:8100
  model_name:  nvidia/cosmos-reason1-7b
  health_check: false
  capabilities:
    streaming: true
    vision:    true

# Riva speech NIMs — same gRPC API as hosted Riva, no function id, and a
# real channel-ready health probe.
stt:
  kind:      riva_grpc
  category:  stt
  base_url:  localhost:50051
  language:  en-US

tts:
  kind:      riva_grpc
  category:  tts
  base_url:  localhost:50052
  voice:     "Magpie-Multilingual.EN-US.Sofia"
  language:  en-US
