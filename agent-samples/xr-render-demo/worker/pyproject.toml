[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-render-demo-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xr-ai-hub-client",
    "xr-ai-agent-runtime",
    "xr-ai-models",
    "xr-ai-tools[live-vision,services]",
    "xr-ai-voice",
    "xr-ai-voicegate",
    "xr-ai-logging",
    "xr-render-scene",
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[tool.uv.sources]
xr-ai-agent-runtime     = { path = "../../../agent-sdk/xr-ai-agent-runtime",                 editable = true }
xr-ai-hub-client        = { path = "../../../agent-sdk/xr-ai-hub-client",                    editable = true }
xr-ai-models       = { path = "../../../agent-sdk/xr-ai-models",       editable = true }
xr-ai-tools        = { path = "../../../agent-sdk/xr-ai-tools",        editable = true }
xr-ai-voice        = { path = "../../../agent-sdk/xr-ai-voice",        editable = true }
xr-ai-voicegate    = { path = "../../../utils/xr-ai-voicegate",        editable = true }
xr-ai-logging      = { path = "../../../utils/xr-ai-logging",          editable = true }
xr-render-scene    = { path = "../scene",                              editable = true }

[project.scripts]
xr_render_demo_worker = "xr_render_demo_worker:run"

[tool.hatch.build.targets.wheel]
only-include = [
    "xr_render_demo_worker.py",
    "agent.py",
    "capabilities.py",
    "dispatch.py",
    "processors.py",
    "tooling.py",
    "config.py",
]
