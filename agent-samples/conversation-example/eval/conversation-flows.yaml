# Each flow is one participant session. The evaluator appends only completed
# user/assistant exchanges to history between turns; it must not seed future
# answers or predictions. Assertions are reported separately by layer.
# A `context_record_required_before` precondition names a completed context record
# that must be present before issuing the turn; otherwise its answer is not scored.
- name: general_planning_continuation
  image: blank
  turns:
    - name: start_general_plan
      authored_completion: "Start by checking how much sunlight the garden gets and where water is available."
      query: I'm planning a small community garden. What should I consider first?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [sunlight, water, soil]
    - name: continue_general_plan
      authored_completion: "Leave enough room for paths between the beds, then fit the layout to the available area."
      query: And what about the space?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [layout, area, space]

- name: current_visual_then_recall
  image: red_left_blue_right
  initial_history:
    - user: In an earlier view, the right-hand shape was red.
      assistant: I recorded that earlier observation.
  turns:
    - name: current_view_over_old_observation
      authored_completion: "The shape on the right is blue."
      query: What color is the shape on the right now?
      acceptable_destinations: [observation]
      admission_expectations: {observation: accept}
      evidence_expectation: current_view
      destination_disposition: answer
      answer_any_of: [blue]
    - name: recall_latest_visual_answer
      authored_completion: "I just said the shape on the right was blue."
      query: What color did you just say was on the right?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: completed_history_only
      destination_disposition: answer
      answer_any_of: [blue]

- name: poisoned_camera_unavailable_history_does_not_block_fresh_view
  image: closed_sign
  initial_history:
    - user: Can you read what is in front of me?
      assistant: I cannot access a camera in this chat.
  turns:
    - name: current_sign_text_over_stale_unavailability_claim
      authored_completion: "The sign reads CLOSED."
      query: What does the sign say right now?
      acceptable_destinations: [observation]
      admission_expectations: {observation: accept}
      evidence_expectation: current_view
      destination_disposition: answer
      answer_any_of: [closed]

- name: general_ar_vr_followup_topic_shift_and_shared_recall
  image: virtual_walkthrough
  turns:
    - name: ask_general_ar_vr_question
      authored_completion: "For a first-time visitor, I'd prioritize readable labels, comfortable pacing, and clear spatial anchors."
      query: I’m preparing an AR/VR walkthrough for a first-time visitor. What should I consider?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_expectation: nonempty
    - name: continue_ar_vr_topic
      authored_completion: "I'd start with readable labels, since visitors need to understand each step without stopping the walkthrough."
      query: Which part would you address first, and why?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: completed_history_only
      destination_disposition: answer
      answer_expectation: nonempty
    - name: switch_to_general_topic
      authored_completion: "18 percent of 250 is 45."
      query: "Separate question: what is 18 percent of 250?"
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [45]
    - name: recall_ar_vr_recommendation_in_general_conversation
      authored_completion: "I first suggested making the labels readable and keeping the walkthrough comfortable to follow."
      query: What was the first thing you suggested for the walkthrough?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: completed_history_only
      destination_disposition: answer
      answer_expectation: nonempty

- name: conversation_handles_ar_vr_and_unrelated_followup
  image: blank
  initial_history:
    - user: I am planning an AR walkthrough for new visitors. What should I consider?
      assistant: "Synthetic seed: consider legibility, comfort, and clear spatial anchoring."
  turns:
    - name: switch_to_unrelated_factual_question
      authored_completion: "Yeast releases carbon dioxide as it ferments, which makes the dough rise."
      query: Why does dough rise when baking?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [yeast, gas, ferment]

- name: direct_visual_handoff_to_general_conversation
  image: virtual_walkthrough
  turns:
    - name: observe_scene_for_later_reasoning
      authored_completion: "I see a broad display ahead, with several labels and controls grouped along its lower edge."
      query: Describe the major visible elements and how they are arranged.
      acceptable_destinations: [observation]
      admission_expectations: {observation: accept}
      evidence_expectation: current_view
      destination_disposition: answer
      answer_expectation: nonempty
    - name: ask_general_conversation_to_use_observation
      authored_completion: "I'd make the labels easier to scan and keep the controls grouped where visitors can reach them."
      query: Based on that observation, what would you improve for an AR/VR walkthrough?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: completed_history_only
      destination_disposition: answer
      answer_expectation: nonempty
    - name: recall_visual_handoff_in_general_conversation
      authored_completion: "The display was ahead, with its labels and controls grouped along the lower edge."
      query: What did you notice about the arrangement before recommending an improvement?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: completed_history_only
      destination_disposition: answer
      answer_expectation: nonempty

- name: incomplete_in_scope_request_gets_task_clarification
  image: blank
  turns:
    - name: open_presentation_task
      authored_completion: "What topic is the presentation about, and who will be listening?"
      query: Help me prepare a short presentation.
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [topic, audience, presentation]
    - name: supply_task_detail
      authored_completion: "For a team research update, focus on the main finding and why it matters. How long is the presentation?"
      query: It's a research update for my team.
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: completed_history_only
      destination_disposition: answer
      answer_should_clarify: true
      clarification_any_of: [length, audience, findings, update]

- name: clarify_visual_referent_then_inspect
  image: red_left_blue_right
  turns:
    - name: ambiguous_visual_reference
      authored_completion: "Do you mean the red shape on the left or the blue circle on the right?"
      query: Can you check that one?
      acceptable_destinations: [conversation, observation]
      acceptable_router_choices: [clarify, conversation]
      route_outcome: select
      admission_expectations: {}
      evidence_expectation: completed_history_or_current_view
      destination_disposition: answer
      answer_should_clarify: true
      clarification_any_of: [which, mean, one]
    - name: clarified_visual_target
      authored_completion: "The blue circle is the one on the right."
      query: I mean the blue circle.
      acceptable_destinations: [observation]
      admission_expectations: {observation: accept}
      evidence_expectation: current_view
      destination_disposition: answer
      answer_any_of: [blue, circle]

- name: visual_clarification_followed_by_new_topic
  image: blank
  initial_history:
    - user: What do you see in front of me?
      assistant: Could you clarify what you would like me to check in the scene?
  turns:
    - name: switch_to_general_calculation
      authored_completion: "Nine times seven is 63."
      query: What is nine times seven?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [63, sixty-three]
    - name: continue_after_topic_shift
      authored_completion: "Eight times eight is 64."
      query: And what is eight times eight?
      acceptable_destinations: [conversation]
      admission_expectations: {conversation: accept}
      evidence_expectation: none
      destination_disposition: answer
      answer_any_of: [64, sixty-four]

