- name: general_question_without_camera
  image: blank
  destination: conversation
  route: direct
  query: What is twice eleven?
  any_of: ["22", twenty-two]

- name: unavailable_external_action
  image: blank
  destination: conversation
  route: direct
  query: Book me a flight to Denver.
  any_of: ["can't", "cannot", "unable"]

- name: read_visible_sign_text
  image: closed_sign
  destination: observation
  route: current_view
  query: Read the large word on the sign.
  any_of: [closed]

- name: resolve_visual_followup_referent
  image: red_left_blue_right
  destination: observation
  route: current_view
  history:
    - user: Which shape is on the right?
      assistant: A blue circle.
  query: What color is the shape on the left?
  any_of: [red]

- name: current_visual_check_over_historical_answer
  image: red_left_blue_right
  destination: observation
  route: current_view
  history:
    - user: Which shape is on the right?
      assistant: A red circle.
  query: What color is the shape on the right now?
  any_of: [blue]

- name: new_question_after_stale_clarification
  image: blank
  destination: conversation
  route: direct
  history:
    - user: What do you see in front of me?
      assistant: Could you clarify what you would like me to check in the scene?
  query: What is nine times seven?
  any_of: ["63", "sixty-three"]

- name: explicit_recall_uses_completed_answer
  image: blank
  destination: conversation
  route: direct
  history:
    - user: What is the capital of Portugal?
      assistant: Lisbon.
  query: What was that again?
  any_of: [Lisbon]

- name: incomplete_followup_uses_completed_history
  image: blank
  destination: conversation
  route: direct
  history:
    - user: I'm preparing for an interview. How should I organize my examples?
      assistant: Use a situation, action, and result structure for each example.
  query: Okay, what should I do next?
  any_of: [practice, aloud]

- name: direct_howto_after_repeated_visual_clarifications
  image: blank
  destination: conversation
  route: direct
  history:
    - user: What's the capital of France?
      assistant: The capital of France is Paris.
    - user: I don't think.
      assistant: I can help clarify what's visible in your current camera view. Could you specify what you'd like me to check? For example, I can identify objects, text, or spatial relationships in the scene.
    - user: Can you teach me how to make pasta?
      assistant: I can help clarify what's visible in your current camera view. Could you specify what you'd like me to check? For example, I can identify objects, text, or spatial relationships in the scene.
    - user: Help me make pasta.
      assistant: I can help clarify what's visible in your current camera view. Could you specify what you'd like me to check? For example, I can identify objects, text, or spatial relationships in the scene.
  query: Stop repeating, just show me how to make pasta.
  any_of: ["add the pasta", "cook according to the package directions"]

- name: direct_howto_after_visual_clarification
  image: blank
  destination: conversation
  route: direct
  history:
    - user: What do you see in front of me?
      assistant: Could you clarify what you would like me to check in the scene?
  query: How do I tie a bowline knot?
  any_of: [rope, loop]

- name: ambiguous_reference_clarifies_before_camera_access
  image: red_left_blue_right
  destination: observation
  route: clarify
  history:
    - user: I am trying to compare these with the earlier example.
      assistant: Which item do you mean?
  query: Can you check that one?
  any_of: [general answer, visible]

- name: domain_scoped_visual_question
  image: red_left_blue_right
  destination: observation
  route: current_view
  query: For my exhibit notes, what color is the circle on the right?
  any_of: [blue]

- name: explain_ar_display_tradeoff
  destination: conversation
  route: direct
  query: What is one tradeoff between optical see-through and video see-through AR displays?
  any_of: [camera, optical, see-through]

- name: recommend_how_to_improve_sign_visibility
  destination: conversation
  route: direct
  query: Why can high contrast improve text legibility in an AR heads-up display?
  any_of: [contrast, background, readable]

- name: recommendation_does_not_assume_unseen_surface
  destination: conversation
  route: direct
  query: What is a common cause of motion discomfort in virtual reality?
  any_of: [motion, latency, mismatch]

- name: use_completed_visual_context_without_rechecking
  destination: conversation
  route: direct
  history:
    - user: What is the main advantage of optical see-through AR?
      assistant: It lets the wearer see the real world directly through the display.
  query: What was its main advantage?
  any_of: [real world, directly, see-through]
