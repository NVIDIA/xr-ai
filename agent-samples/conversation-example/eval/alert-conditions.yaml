# Image-condition cases. The hosted evaluation retains submitted image bytes and hashes.
- name: condition_absent
  image: red_left_blue_right
  condition: Alert me when the square on the left is green.
  expected: "no"
- name: condition_visible
  image: green_left_blue_right
  condition: Alert me when the square on the left is green.
  expected: "yes"
- name: no_visible_hand
  image: cached_office
  condition: Alert me when a hand is visible on the desk.
  expected: "no"
- name: obscured_detail_is_uncertain
  image: cached_office
  condition: Alert me when the partly hidden person is clearly wearing glasses.
  expected: "no"
- name: motion_not_established_by_one_frame
  image: red_left_blue_right
  condition: Alert me when the blue circle moves.
  expected: "no"
- name: backup_text_judge_motion_not_established_by_one_frame
  path: cosmos_observation_then_clef_text
  image: red_left_blue_right
  condition: Alert me when the blue circle moves.
  expected: "no"
  observation_rubric: The single-frame observation cannot establish movement or a previous state.

# Follow-up generation rubric, not an authored model completion.
- name: triggered_description_is_relevant
  image: green_left_blue_right
  condition: Alert me when the square on the left is green.
  expected: "yes"
  description_rubric: One short spoken sentence about the visible green square; no repeated alert announcement, unrelated blue circle, or invented motion.
