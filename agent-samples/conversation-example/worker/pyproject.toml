[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversation-example-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-relay>=0.10.0,<0.11",
    "xr-ai-agent-runtime",
    "xr-ai-conversation",
    "xr-ai-routing[runtime]",
    "xr-ai-hub-client",
    "xr-ai-interaction",
    "xr-ai-logging",
    "xr-ai-models[riva]",
    "xr-ai-tools[frames,vision]",
    "xr-ai-voice",
    "xr-ai-voicegate",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[tool.uv.sources]
xr-ai-agent-runtime = { path = "../../../agent-sdk/xr-ai-runtime", editable = true }
xr-ai-conversation = { path = "../../../agent-sdk/xr-ai-conversation", editable = true }
xr-ai-routing = { path = "../../../agent-sdk/xr-ai-routing", editable = true }
xr-ai-hub-client = { path = "../../../agent-sdk/xr-ai-hub", editable = true }
xr-ai-interaction = { path = "../../../agent-sdk/xr-ai-interaction", editable = true }
xr-ai-logging   = { path = "../../../utils/xr-ai-logging", editable = true }
xr-ai-models    = { path = "../../../agent-sdk/xr-ai-models", editable = true }
xr-ai-tools     = { path = "../../../agent-sdk/xr-ai-tools", editable = true }
xr-ai-voice     = { path = "../../../agent-sdk/xr-ai-voice", editable = true }
xr-ai-voicegate = { path = "../../../utils/xr-ai-voicegate", editable = true }

[project.scripts]
conversation_example_worker = "conversation_example_worker.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["conversation_example_worker"]
