[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conversation-example-model-servers"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyyaml>=6.0",
    "xr-ai-gpu",
    "xr-ai-launcher",
    "xr-ai-logging",
    "xr-ai-models",
    "xr-ai-model-server-stack",
    "xr-ai-vllm",
]

[tool.uv.sources]
xr-ai-gpu = { path = "../../../utils/xr-ai-gpu", editable = true }
xr-ai-model-server-stack = { path = "../../../utils/xr-ai-model-server-stack", editable = true }
xr-ai-launcher = { path = "../../../utils/xr-ai-launcher", editable = true }
xr-ai-logging = { path = "../../../utils/xr-ai-logging", editable = true }
xr-ai-models = { path = "../../../agent-sdk/xr-ai-models", editable = true }
xr-ai-vllm = { path = "../../../utils/xr-ai-vllm", editable = true }

[project.scripts]
conversation_example_model_servers = "main:run"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "_profile_stack.py"]
