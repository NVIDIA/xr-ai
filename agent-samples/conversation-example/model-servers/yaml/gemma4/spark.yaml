# Placement for Gemma 4 and D3 profiles; model IDs live in yaml/model_profiles/.
# Starting budgets for E2B/E4B with D3 Nano; qualify memory and latency for
# larger checkpoints on the target hardware before increasing concurrency.
speaker-stt:
  cuda_visible_devices: '0'
tts:
  cuda_visible_devices: '0'
gemma4:
  cuda_visible_devices: '0'
  max_num_seqs: 4
  gpu_memory_utilization: 0.35
  kv_cache_memory_bytes: 2147483648
  spark_uma: true
d3:
  cuda_visible_devices: '0'
  max_num_seqs: 4
  gpu_memory_utilization: 0.2
  spark_uma: true
