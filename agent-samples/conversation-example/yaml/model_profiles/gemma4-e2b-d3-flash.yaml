# Selected by models_config in ../conversation_example_worker.yaml.
# Server defaults < GPU profile < the server overrides below.
# Copy this profile to use other Gemma 4 or D3 checkpoints: edit only model IDs.
servers:
  speaker-stt: {}
  tts: {}
  gemma4:
    model: google/gemma-4-E2B-it
  d3:
    model: vllm-sr/d3-flash

models:
  llm:
    category: llm
    adapter: &gemma4
      kind: openai_compat
      model_name: gemma4
      thinking: {control: chat_template, default: true}
      capabilities: {streaming: true, vision: true, reasoning: true}
      default_extras:
        max_tokens: 4608
        temperature: 0.25
    endpoint: &gemma4_endpoint
      base_url: http://localhost:8108
  vlm:
    category: vlm
    adapter: *gemma4
    endpoint: *gemma4_endpoint
  router:
    category: decision
    adapter:
      kind: systemone
      model_name: d3
    endpoint:
      base_url: http://localhost:8120
  tts:
    adapter: {preset: pocket_tts}
    endpoint: {base_url: http://localhost:8105}
