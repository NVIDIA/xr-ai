# Selected by models_config in ../conversation_example_worker.yaml.
# Server defaults < portable gemma4.yaml < the server overrides below.
# Official QAT E2B + BF16 Nano: about 18.1 GiB warm, 18.7 GiB sampled peak
# for all four services on one RTX 6000 Ada (two concurrent text/image requests).
# Leave headroom for startup and the agent; this is a check, not a reservation.
min_free_memory_gib: 21
servers:
  speaker-stt: {}
  tts: {}
  gemma4:
    model: google/gemma-4-E2B-it-qat-w4a16-ct
  d3:
    model: vllm-sr/d3-nano

models:
  llm:
    category: llm
    adapter: &gemma4
      kind: openai_compat
      model_name: gemma4
      thinking: {control: chat_template, default: true}
      capabilities: {streaming: true, vision: true, reasoning: true}
      default_extras:
        max_tokens: 4608
        temperature: 0.25
    endpoint: &gemma4_endpoint
      base_url: http://localhost:8108
  vlm:
    category: vlm
    adapter: *gemma4
    endpoint: *gemma4_endpoint
  router:
    category: decision
    adapter:
      kind: systemone
      model_name: d3
    endpoint:
      base_url: http://localhost:8120
  tts:
    adapter: {preset: pocket_tts}
    endpoint: {base_url: http://localhost:8105}
