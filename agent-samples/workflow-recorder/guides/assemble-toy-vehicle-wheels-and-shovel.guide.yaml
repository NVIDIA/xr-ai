# Evidence: artifacts/sessions/20260914T191651112328Z-web-client/.
# Starting parts: caption/frame 12 (19:16:56.596933 UTC), transcript 1.
# Wheel attachment: frames 35 and 70 (19:17:08.129167 and 19:17:25.632399),
# captions 4-7, and transcript 2 (19:17:23.604460).
# Shovel attachment: transcripts 3-5 (19:17:28.044528-19:17:33.544379),
# frames 93 and 105 (19:17:37.168081 and 19:17:43.170260).
# Frame 105 shows the orange shovel joined to the yellow front with the hand
# removed; this is more specific than caption 10's description of it as nearby.
# Transcript 6 declares completion, but does not prove connection strength.
# The initial tabletop-only observation is context, not a demonstrated action.
# Review gaps: exact connector engagement, required force, attachment strength,
# and rolling performance are not established. No such checks are claimed here.
# Only a human reviewer may change task.status to approved.

schema_version: 1
task:
  id: assemble_toy_vehicle_wheels_shovel
  name: Assemble toy vehicle
  version: 1
  status: approved
  source_session: 20260914T191651112328Z-web-client
  start_step: identify_starting_parts
  foreground_prompt: >-
    Guide the user through the recorded toy vehicle assembly: identify the
    yellow-and-red vehicle with two wheels already installed and two loose black
    wheels, attach the remaining wheels, then attach the orange shovel to the
    front identified by the yellow component. The starting vehicle body is
    already assembled; its construction was not recorded. Use only the active
    step's recorded instructions and visible evidence. Exact connector engagement,
    required force, attachment strength, and rolling performance were not
    established. Do not invent a click, locking mechanism, or functional test.
    If a connection is unclear, ask the user to show it more clearly. Explain
    that the user says next or continue after completion, or skip to leave a
    step unverified. Never advance automatically or claim a skipped check passed.
  complete_message: >-
    You have reached the end of the toy vehicle assembly guide. Any skipped
    checks remain unverified; these visual checks do not establish attachment
    strength or rolling performance.

state:
  starting_parts_visible:
    type: boolean
    description: The vehicle with two installed wheels and two loose black wheels is visible.
    initial: false
  four_wheels_visible:
    type: boolean
    description: Four black wheels visibly occupy the vehicle's wheel positions.
    initial: false
  front_shovel_visible:
    type: boolean
    description: The orange shovel is visibly joined to the yellow front and all four wheels remain visible.
    initial: false

steps:
  - id: identify_starting_parts
    title: Identify the vehicle and two remaining wheels
    reads: []
    writes: [starting_parts_visible]
    trigger:
      function: current_view
      interval_s: 3
      arguments:
        question: >-
          Answer exactly "starting parts visible" or "starting parts not visible".
          Can you clearly see a yellow-and-red toy vehicle with two black wheels
          already installed, two empty wheel positions, and two separate loose
          black wheels beside it or held nearby? If any required item or wheel
          position is obscured or uncertain, answer "starting parts not visible".
    agent:
      prompt: Preserve the direct visual classification. Do not infer hidden wheels or off-camera parts.
      tools: []
    voice:
      prompt: >-
        Ask the user to show the partly assembled yellow-and-red vehicle and two
        loose black wheels. The recording begins with two wheels already on the
        vehicle. Do not instruct removal of wheels if the user's vehicle is
        already further assembled; explain the starting condition and the skip
        command. Construction of the vehicle body was not recorded.
      tools: [current_view]
    evidence:
      pattern: '(?i)starting parts visible'
      consecutive: 2
      commit:
        starting_parts_visible: true
    complete_when:
      starting_parts_visible: true
    next: attach_remaining_wheels
    complete_on_skip: false
    state_on_skip: {}
    messages:
      enter: >-
        Show the vehicle with its two installed wheels and the two loose black
        wheels. Keep the parts and empty wheel positions visible.
      complete: The starting vehicle and two loose wheels are visible. Say next when ready.
      skip: Skipping the starting-parts check; the starting condition remains unverified.

  - id: attach_remaining_wheels
    title: Attach the two remaining wheels
    reads: [starting_parts_visible]
    writes: [four_wheels_visible]
    trigger:
      function: current_view
      interval_s: 3
      arguments:
        question: >-
          Answer exactly "four wheels fitted" or "four wheels not confirmed".
          Does the yellow-and-red toy vehicle visibly have four black wheels,
          one on each of its four wheel positions, with no wheel merely lying
          beside it or being held in place? Require all four wheels and their
          placement against the vehicle to be clear. If a wheel is hidden,
          detached, or uncertain, answer "four wheels not confirmed".
    agent:
      prompt: >-
        Preserve the direct visual classification. Four visible fitted wheels
        establish only visible placement, not axle locking or rolling performance.
      tools: []
    voice:
      prompt: >-
        Explain that the demonstrator turns the vehicle to access the exposed
        wheel positions, aligns each loose wheel's center opening with an exposed
        axle, and fits the two remaining wheels. Ask the user to return the
        vehicle upright and show all four wheels with hands clear. Do not specify
        insertion force, a click, or an unseen fastening mechanism. A skipped
        starting-parts check does not count as verified preparation.
      tools: [current_view]
    evidence:
      pattern: '(?i)four wheels fitted'
      consecutive: 2
      commit:
        four_wheels_visible: true
    complete_when:
      four_wheels_visible: true
    next: attach_front_shovel
    complete_on_skip: false
    state_on_skip: {}
    messages:
      enter: >-
        Align each loose wheel with one of the two empty axle positions and fit
        it onto the vehicle. Turn the vehicle as needed for access, then set it
        upright and show all four wheels with your hands clear.
      complete: All four wheels appear fitted. Say next to attach the front shovel.
      skip: Skipping the wheel check; four-wheel placement remains unverified.

  - id: attach_front_shovel
    title: Attach the orange shovel at the yellow front
    reads: [four_wheels_visible]
    writes: [front_shovel_visible]
    trigger:
      function: current_view
      interval_s: 3
      arguments:
        question: >-
          Answer exactly "front shovel fitted" or "front shovel not confirmed".
          Is the orange shovel visibly joined to the yellow front of the toy
          vehicle by its connecting arms, with its broad toothed blade extending
          outward, all four black wheels still visibly in their wheel positions,
          and no hand holding the shovel in place? If the
          yellow front, or any wheel is obscured or uncertain, answer
          "front shovel not confirmed".
    agent:
      prompt: >-
        Preserve the direct visual classification. Mere proximity and a spoken
        claim of completion do not prove attachment. Do not infer connection
        strength from visible alignment.
      tools: []
    voice:
      prompt: >-
        Identify the front by the yellow body component, as stated by the
        demonstrator; its direction on the table can change. Explain how to
        align the orange shovel's connecting arms with that front and attach it
        with the broad toothed blade facing outward, matching the recorded final
        view. Exact connector engagement and required force are unclear in the
        recording, so do not invent them. Ask the user to show the connection
        and all four wheels with hands removed. If the connection cannot be
        seen clearly, request a clearer view rather than declaring success.
      tools: [current_view]
    evidence:
      pattern: '(?i)front shovel fitted'
      consecutive: 2
      commit:
        front_shovel_visible: true
    complete_when:
      front_shovel_visible: true
    next: null
    complete_on_skip: false
    state_on_skip: {}
    messages:
      enter: >-
        The yellow component marks the front. Align the orange shovel's
        connecting arms with that end and attach the shovel with its toothed
        blade facing outward. Keep the front connection and all four wheels
        visible with your hands clear for the final visual check.
      complete: >-
        The shovel appears joined to the yellow front and all four wheels are
        visible. Say next to finish the guide.
      skip: Skipping the shovel and final assembly check; the final arrangement remains unverified.
