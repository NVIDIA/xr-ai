id: show-seven
title: Show seven
instructions: Hold up exactly seven fingers across both hands and keep both hands visible to the camera.
visual_completion_criteria: Exactly seven extended fingers are clearly visible across two non-overlapping hands.
expected_finger_count: 7
expected_hands: 2
