id: show-ten
title: Show ten
instructions: Hold up all ten fingers and keep both hands visible to the camera.
visual_completion_criteria: Exactly ten extended fingers are clearly visible across two non-overlapping hands.
expected_finger_count: 10
expected_hands: 2
