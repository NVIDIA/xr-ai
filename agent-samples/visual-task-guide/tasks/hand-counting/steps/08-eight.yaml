id: show-eight
title: Show eight
instructions: Hold up exactly eight fingers across both hands and keep both hands visible to the camera.
visual_completion_criteria: Exactly eight extended fingers are clearly visible across two non-overlapping hands.
expected_finger_count: 8
expected_hands: 2
