[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-task-guide-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xr-ai-hub-client",
    "xr-ai-logging",
    "xr-ai-models",
    "xr-ai-nat[agents,services,vision,voice]",
    "xr-ai-voice",
    "xr-ai-voicegate",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[tool.uv.sources]
xr-ai-hub-client = { path = "../../../agent-sdk/xr-ai-hub-client", editable = true }
xr-ai-logging    = { path = "../../../utils/xr-ai-logging", editable = true }
xr-ai-models     = { path = "../../../agent-sdk/xr-ai-models", editable = true }
xr-ai-nat        = { path = "../../../agent-sdk/xr-ai-nat", editable = true }
xr-ai-voice      = { path = "../../../agent-sdk/xr-ai-voice", editable = true }
xr-ai-voicegate  = { path = "../../../utils/xr-ai-voicegate", editable = true }

[project.scripts]
visual_task_guide_worker = "visual_task_guide_worker.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["visual_task_guide_worker"]
