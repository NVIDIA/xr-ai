# Self-hosted NIM: Riva TTS (magpie) — the same model the hosted-NIM overlay
# uses. Workers reach the gRPC port via the riva_grpc model kind; http_port
# serves /v1/health/ready only.
image:     nvcr.io/nim/nvidia/magpie-tts-multilingual:latest
http_port: 9011
grpc_port: 50052

# Repo-root models/ (resolved relative to this file).
nim_cache: ../../../models/nim

# Two-GPU default placement: speech on GPU 0, greedy VLM alone on GPU 1.
cuda_visible_devices: "0"
