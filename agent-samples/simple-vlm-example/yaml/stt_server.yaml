# Standalone STT configuration. STT reuses an existing healthy server by port,
# so this config intentionally avoids model-server-specific GPU placement.

model:       nvidia/parakeet-tdt-0.6b-v3
device:      auto
port:        8103
startup_timeout_s: 600
model_cache: ../../../models
