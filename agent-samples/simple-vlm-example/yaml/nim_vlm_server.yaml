# Self-hosted NIM: VLM — Cosmos-Reason1-7B, the same model the local
# backend's vlm-server runs, so vision prompts behave alike.
image:     nvcr.io/nim/nvidia/cosmos-reason1-7b:latest
http_port: 8100

# Repo-root models/ (resolved relative to this file).
nim_cache: ../../../models/nim

# GPU 1 to itself (speech NIMs live on GPU 0) — a generous KV bound so
# concurrent sessions each get real cache instead of queueing.
cuda_visible_devices: "1"
env:
  NIM_MAX_MODEL_LEN: "8192"
  NIM_KVCACHE_PERCENT: "0.85"
