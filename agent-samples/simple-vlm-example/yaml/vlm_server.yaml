# Standalone VLM configuration for systems smaller than the shared
# model-server hardware profiles.

model:       nvidia/Cosmos3-Nano
hf_overrides:
  architectures:
    - Cosmos3ForConditionalGeneration
port:        8100
model_cache: ../../../models
async_scheduling: true
mm_encoder_tp_mode: data

# Leave enough of a 24 GiB GPU for the 16.8 GiB Reasoner weights and runtime.
gpu_memory_utilization: 0.85

# vLLM runtime: pip (this wrapper's venv) or docker (NGC nvcr.io/nvidia/vllm).
# See services/vlm-server/vlm_server.yaml for the full toggle docs.
vllm_backend: docker
vllm_image:   nvcr.io/nvidia/vllm:26.07-py3
