# Self-hosted NIM: Riva ASR (parakeet). Workers reach the gRPC port via the
# riva_grpc model kind; http_port serves /v1/health/ready only.
image:     nvcr.io/nim/nvidia/parakeet-tdt-0.6b-v2:latest
http_port: 9010
grpc_port: 50051

# Repo-root models/ (resolved relative to this file).
nim_cache: ../../../models/nim

# Two-GPU default placement: speech on GPU 0, greedy VLM alone on GPU 1.
cuda_visible_devices: "0"

# Single-process inference: the default multiprocessing mode runs two CUDA
# processes; one is plenty for demo traffic. Expect ~14 GB VRAM either way
# (mostly the TRT-LLM runtime pool, not the 0.6B model).
env:
  NIM_USE_MULTIPROCESSING_FOR_INFERENCE: "false"
