# Sample workload overrides. Ports, models, and images come from shared defaults.
# These retain the existing conservative budgets; tune together on the target GPU.
# With explicit KV bytes, utilization is startup admission, not a total-memory cap.
stt: {}
tts:
  cuda_visible_devices: '0'
vlm:
  gpu_memory_utilization: 0.2
  kv_cache_memory_bytes: 1610612736
  max_num_seqs: 4
  spark_uma: true
