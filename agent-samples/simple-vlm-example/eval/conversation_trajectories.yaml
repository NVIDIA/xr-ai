      image: "blue_square"
      route: "direct"
      any_of: ["red"]
    - query: "Which color was reported for bin K?"
      image: "blank"
      route: "direct"
      any_of: ["green"]
    - query: "I've moved the camera. What color is the physical square now?"
      image: "blue_square"
      route: "current_view"
      any_of: ["blue"]
    - query: "What does the updated warehouse report say?"
      image: "blank"
      route: "direct"
      any_of: ["yellow"]
      app_context: "{\"background_reports\":[{\"source\":\"warehouse-agent\",\"state\":\"corrected\",\"result\":\"bin K is yellow\"}]}"
    - query: "Which warehouse bin was that update about?"
      image: "blank"
      route: "direct"
