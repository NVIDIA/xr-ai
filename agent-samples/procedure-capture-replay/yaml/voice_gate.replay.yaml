# Enroll the speaker before accepting guide questions and replay controls.
mode: conversation
magic_phrases: []
listening_chime: false
followup_grace_s: 0.0
# Let replay handle "stop replay"; do not consume it as a generic STOP.
stop_commands_enabled: false

# These controls select the speaker, not the guide's execution state.
conversation:
  start_phrase: "Hey agent, let's start talking"
  stop_phrase: "Hey agent, let's stop talking"
  require_wake_phrase: false
  phrase_window_s: 6.0

# Wait for speaker ASR; never silently fall back to unfiltered batch STT.
speaker:
  enabled: true
  backend: required
  base_url: http://127.0.0.1:8102
