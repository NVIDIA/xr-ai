guides_dir: fixtures
guide: Indicator Check
scenes:
  red: {rectangle: red}
  blue: {rectangle: blue}
actions:
  - {action: image, scene: red}
  - {action: say, text: "What is my status?", expect: inactive, tools: [workflow__status]}
  - {action: say, text: "Start replay", expect: Show a blue indicator, tools: [workflow__restart]}
  - {action: observe, answers: ['NO', 'No', 'no'], count: 2}
  - {action: say, text: "What is my status?", expect: 'current step: Check indicator\.$', tools: [workflow__status]}
  - {action: say, text: "Could I continue?", expect: not complete, tools: [workflow__advance], arguments: [{skip: false}]}
  - {action: image, scene: blue}
  - {action: wait_speech, expect: The indicator is blue}
  - {action: say, text: "What is my status?", expect: Complete, tools: [workflow__status]}
  - {action: say, text: "Next", expect: ten-second wait, tools: [workflow__advance], arguments: [{skip: false}]}
  - {action: say, text: "How much time remains?", tools: [clock__timer], arguments: [{}]}
  - {action: wait_speech, expect: Indicator check finished, timeout_s: 60}
  - {action: say, text: "What is my status?", expect: inactive, tools: [workflow__status]}
  - {action: say, text: "Start replay", expect: Show a blue indicator, tools: [workflow__restart]}
  - {action: say, text: "Stop replay", expect: Replay stopped, tools: [workflow__reset]}
