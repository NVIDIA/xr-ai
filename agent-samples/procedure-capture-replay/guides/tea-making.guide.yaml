# Numi specifies 5–6 minutes for Chamomile Lemon; use the five-minute minimum.
# https://numitea.com/products/chamomile-lemon
# Its general herbal-tea instructions specify boiling water:
# https://numitea.com/blogs/news/the-ultimate-guide-to-types-of-tea-and-their-benefits
schema_version: 1
task:
  id: tea_making
  name: Tea Making
  version: 2
  status: approved
  source_session: hand-authored-example-not-a-recording
  start_step: identify
  foreground_prompt: >-
    Guide brewing Numi Chamomile Lemon herbal tea, not green tea or another
    chamomile blend. This recipe uses boiling water, verified here by a current
    water reading of 100 C or 212 F, and a five-minute steep selected from the
    manufacturer's 5–6 minute instructions. Do not silently change the recipe.
    If the user's packet differs, or local boiling temperature cannot reach
    this display target, stop and adapt the guide rather than bypass verification.
    Use a stable heat-safe vessel and follow appliance instructions. Keep hands
    clear of hot water and steam; never ask the user to tilt a hot vessel for
    the camera. Visual judgments do not guarantee safety. No retrieval or
    temperature-conversion tools are available. Say next advances a verified
    visual step. The timer starts only on entering the fourth step, not when
    immersion is first detected. When the timer expires the run ends automatically;
    no next command is needed to finish. Start replay begins a fresh run.
  complete_message: Five minutes have elapsed. Your Numi Chamomile Lemon guide is complete. Carefully remove the tea bag and let the drink cool before tasting.

state:
  tea_identified:
    type: boolean
    description: The visible packet identifies both Numi and Chamomile Lemon.
    initial: false
  water_at_target:
    type: boolean
    description: A current water-temperature reading visibly shows 100 C or 212 F.
    initial: false
  tea_immersed:
    type: boolean
    description: The tea bag visibly contacts water inside the same vessel.
    initial: false
  steeping_complete:
    type: boolean
    description: The runtime-owned five-minute steeping timer has expired.
    initial: false

steps:
  - id: identify
    title: Read the tea packet
    reads: []
    writes: [tea_identified]
    trigger:
      function: current_view
      interval_s: 1.5
      arguments:
        question: >-
          Read the brand and full blend name printed on the same tea packet or
          box. Return the actual printed words in uppercase as BRAND | BLEND.
          Do not substitute the desired product for the visible label. If either
          cannot be fully read, return UNKNOWN. Use printed words, not colors,
          flowers, nearby cups, or knowledge of likely products. Output only
          the two labels separated by |, or UNKNOWN.
      result_field: text
    evidence:
      pattern: '^NUMI \| CHAMOMILE LEMON$'
      consecutive: 2
      commit: {tea_identified: true}
    agent:
      prompt: Confirm only visible Numi branding and the full Chamomile Lemon blend name on the same product.
      tools: []
    voice:
      prompt: >-
        Ask to see the packet front so both Numi and Chamomile Lemon are legible.
        Use current_view for label questions. A different brand, a different Numi
        blend, or chamomile alone is not the selected product. Do not say the
        package is verified based on a user assertion. The fixed recipe is
        boiling water and five minutes, not green-tea settings.
      tools: [current_view]
    complete_when: {tea_identified: true}
    next: heat_water
    complete_on_skip: true
    messages:
      enter: Show the Numi Chamomile Lemon packet so I can read the brand and tea name.
      complete: The packet identifies Numi Chamomile Lemon. Say next to check the water temperature.
      skip: Packet verification skipped; ending this run rather than choosing an unverified tea.

  - id: heat_water
    title: Verify the brewing temperature
    reads: []
    writes: [water_at_target]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          Read the actual CURRENT water temperature from a kettle display or
          immersed thermometer. Return only the number and unit, such as 75 C
          or 167 F. Ignore target or set temperatures, heater lights, and printed
          instructions. If there is no readable current measurement with its
          unit, return UNKNOWN. Do not infer temperature from steam or substitute
          a desired brewing temperature. Do not convert units.
      result_field: text
    evidence:
      pattern: '^(100 C|212 F)$'
      consecutive: 2
      commit: {water_at_target: true}
    agent:
      prompt: Confirm only the visible current water reading, not a setpoint or a claim that the water is boiling.
      tools: []
    voice:
      prompt: >-
        Ask for boiling water and a safely visible current temperature display
        of 100 C or 212 F. Use current_view for readings. Do not substitute a
        heater indicator, steam, a target setting, or an elapsed-time estimate.
        If current temperature cannot be read, say verification is unavailable.
        Never direct heating an empty vessel, overfilling, or defeating an
        appliance's controls to reach a reading.
      tools: [current_view]
    complete_when: {water_at_target: true}
    next: start_steeping
    complete_on_skip: true
    messages:
      enter: Heat fresh water according to your appliance instructions. Show a current water-temperature reading of 100 degrees Celsius or 212 Fahrenheit.
      complete: The displayed current water temperature is at the brewing target. Say next to put the tea in the water.
      skip: Temperature verification skipped; ending this run without claiming the water is ready.

  - id: start_steeping
    title: Put the tea in water
    reads: []
    writes: [tea_immersed]
    trigger:
      function: current_view
      interval_s: 2
      arguments:
        question: >-
          Is a tea bag visibly in water inside a vessel? A bag floating on the
          liquid surface counts; it need not sink. Require visible liquid and
          visible bag contact, not just a bag inside a cup. Answer YES only for
          that contact, NO for a dry bag in an empty vessel or a bag above or
          beside water, UNKNOWN if liquid or contact is obscured. The cup rim,
          cup outline, and a string alone are not evidence of water. Output only
          YES, NO, or UNKNOWN.
      result_field: text
    evidence:
      pattern: '^YES$'
      consecutive: 2
      commit: {tea_immersed: true}
    agent:
      prompt: Confirm visible tea-bag contact with visible water, not a nearby bag or string. Do not write a timer timestamp.
      tools: []
    voice:
      prompt: >-
        Guide placing the tea bag in the prepared water safely. Use current_view
        for visual checks. The timer is not running in this step. After verified
        immersion ask the user to say next promptly to enter the timer step.
        Never claim that immersion itself started the timer.
      tools: [current_view]
    complete_when: {tea_immersed: true}
    next: steep_timer
    complete_on_skip: true
    messages:
      enter: Carefully put the Numi Chamomile Lemon tea bag in the prepared water, keeping the vessel stable.
      complete: The tea bag is visibly in the water. Say next now to start the five-minute steeping timer.
      skip: Immersion verification and the timer were skipped; this run is not a verified completion.

  - id: steep_timer
    title: Start the steeping timer
    reads: []
    writes: [steeping_complete]
    trigger:
      function: clock__timer
      interval_s: 1
      arguments:
        duration_s: 300
      result_field: expired
    evidence:
      pattern: '^true$'
      consecutive: 1
      commit: {steeping_complete: true}
    agent:
      prompt: Complete only when the fresh runtime timer reports expired. Images and user claims cannot replace elapsed time.
      tools: []
    voice:
      prompt: >-
        Call clock__timer with no arguments for elapsed-time, remaining-time,
        or timer-completion questions. Use its fresh result, not the tea color,
        a guessed start timestamp, or a user's estimate. This five-minute timer
        starts on entry to this step. When it expires the guide ends automatically;
        do not ask the user to say next to finish. Stop replay cancels the run.
        The timer cannot verify continued tea immersion throughout the wait.
      tools: [clock__timer]
    complete_when: {steeping_complete: true}
    next: null
    finish_on_complete: true
    messages:
      enter: The five-minute steeping timer is now running. I will let you know when the guide is finished.
      complete: Five minutes have elapsed. The guide is complete; carefully remove the tea bag.
      skip: Timer skipped; the full steeping duration was not verified.
