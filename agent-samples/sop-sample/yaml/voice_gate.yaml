# No wake phrase or listening chime. "start recording" and "stop recording"
# are sample-owned commands, separate from shared media capture.
# The shared voice pipeline publishes transcripts before gate filtering.
magic_phrases: []
listening_chime: false
stop_commands_enabled: false  # "stop" is narration, not a spoken control.
followup_grace_s: 0.0
