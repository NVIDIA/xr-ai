# Optional participant-wide media capture, enabled by --capture.
# Each bundle spans the connection, independently of SOP recording commands.
hub_sub_addr: ipc:///tmp/xr_hub_pub
hub_push_addr: ipc:///tmp/xr_hub_in
out_dir: ../artifacts/captures
profile: demo
session_mode: participant
sample_fps: 30.0
max_total_bytes: 0  # Retain recordings until manually removed.
