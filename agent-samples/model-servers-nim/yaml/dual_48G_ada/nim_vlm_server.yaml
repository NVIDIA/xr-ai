# Cosmos3 Nano Reasoner, preserving the original sample's model size.
# Both controls are set because the image's inference.py supplies engine extra
# args in addition to nimlib's NIM_KVCACHE_PERCENT defaults. These are fractions
# of total GPU memory for weights + runtime + cache, not fractions of free VRAM.
image: nvcr.io/nim/nvidia/cosmos3-reasoner:1.7.0@sha256:19add3edaaa77c4030c75eb27d30939c29ca93807bb7af10a1876f05d520026c
container_name: xr-ai-model-servers-nim-cosmos
http_port: 8100
nim_cache: ../../../../models/nim
cuda_visible_devices: "0"
env:
  NIM_MODEL_SIZE: "nano"
  NIM_MAX_MODEL_LEN: "8192"
  NIM_MAX_NUM_SEQS: "4"
  NIM_MAX_IMAGES_PER_PROMPT: "4"
  NIM_MAX_VIDEOS_PER_PROMPT: "0"
  NIM_GPU_MEMORY_UTILIZATION: "0.36"
  NIM_KVCACHE_PERCENT: "0.36"
  NIM_DISABLE_CUDA_GRAPH: "1"
  NIM_COMPILATION_CONFIG: '{"cudagraph_mode": "NONE", "compile_mm_encoder": false}'
  # FP8 Nano vLLM checkpoint profile tagged L40S (Ada, SM 8.9), also used
  # on RTX 6000 Ada (SM 8.9). Contains weights, not a GPU-specific TRT engine.
  # Explicit selection prevents the generic BF16 fallback from exceeding the
  # 17.3 GiB budget alongside the two speech NIMs. Validate on the target Ada.
  NIM_MODEL_PROFILE: "17fedc428e5a9220fae87b540fc9f324eb9e521d35d733de5fe87253db14e6e7"
