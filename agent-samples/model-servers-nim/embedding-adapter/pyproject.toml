[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nim-embedding-adapter"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["xr-ai-models", "xr-ai-logging", "fastapi>=0.115", "uvicorn>=0.30", "pyyaml>=6.0", "httpx>=0.27"]

[tool.uv.sources]
xr-ai-models = { path = "../../../agent-sdk/xr-ai-models", editable = true }
xr-ai-logging = { path = "../../../utils/xr-ai-logging", editable = true }

[project.scripts]
nim_embedding_adapter = "nim_embedding_adapter.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["nim_embedding_adapter"]
