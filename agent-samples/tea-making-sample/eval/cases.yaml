- name: idle-conversation
  query: Hello there.
  expected_tool: null
- name: idle-answers-unrelated-general-knowledge
  query: What is the capital of France?
  expected_tool: null
  forbidden_response: I can only help with the active tea guide right now.
- name: idle-routes-visible-shirt-color
  query: What color is the shirt?
  expected_tool: current_view
  forbidden_response: I can only help with the active tea guide right now.
- name: idle-routes-open-ended-scene-question
  query: Describe my surroundings.
  expected_tool: current_view
- name: idle-routes-visual-reference
  query: What is this?
  expected_tool: current_view
- name: idle-routes-visible-background
  query: What is in the background?
  expected_tool: current_view
- name: start-tea-guide
  query: Help me make a cup of tea.
  expected_tool: workflow__start
- name: inspect-current-view
  query: What am I holding right now?
  expected_tool: current_view
- name: retrieve-tea-fact
  query: What temperature is generally recommended for white tea?
  expected_tool: rag_lookup
- name: start-change-watch
  query: Start watching for a spill near the kettle.
  expected_tool: change_watch__start
- name: stop-change-watch
  query: Turn off the visual observer.
  expected_tool: change_watch__stop
- name: start-transcript
  query: Start recording our conversation.
  expected_tool: transcript__start
- name: start-video-log
  query: Start a general visual activity log.
  expected_tool: video_log__start
- name: query-background-context
  query: What did the background watchers report recently?
  expected_tool: application_context__query

- name: active-answers-current-step-question
  route: active
  step: fill_water
  query: What should I do at this step?
  expected_tool: null
  expected_response_pattern: "(?i)\\b(?:fill|water|vessel)\\b"
  forbidden_response: I can only help with the active tea guide right now.

- name: active-answers-tea-instructions-question
  route: active
  step: fill_water
  query: What are the tea instructions?
  expected_tool: null
  expected_response_pattern: "(?i)\\b(?:fill|water|vessel)\\b"
  max_response_chars: 180
  forbidden_response: I can only help with the active tea guide right now.

- name: active-answers-next-step-question
  route: active
  step: fill_water
  query: What is the next step?
  expected_tool: null
  expected_response_pattern: "(?i)\\b(?:heat|water)\\b"
  forbidden_response: I can only help with the active tea guide right now.

- name: completed-identification-answers-transcribed-instructions-question
  route: active
  step: identify
  observations:
    - Twinings English Breakfast tea label, 93 Celsius, 3 minutes.
  state_updates:
    tea_name: English breakfast tea
    target_temperature_c: 93
    steep_duration_s: 180
    guidance_source: package
    tea_ready: true
  query: What are the T instructions?
  expected_tool: null
  expected_response_pattern: "(?i)\\b(?:fill|water|heat|steep)\\b"
  max_response_chars: 180
  forbidden_response: I can only help with the active tea guide right now.

