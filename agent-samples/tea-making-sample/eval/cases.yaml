routes:
  - utterance: Next.
    expected_tool: workflow__advance
  - utterance: Walk me through brewing a cup.
    expected_tool: workflow__start
  - utterance: Move to the following stage.
    expected_tool: workflow__advance
  - utterance: Cancel the walkthrough.
    expected_tool: workflow__reset
  - utterance: Which stage are we on?
    expected_tool: workflow__status
  - utterance: Is that enough water right now?
    expected_tool: workflow__ask_step
  - utterance: Tell me what you learned about this tea.
    expected_tool: workflow__ask_step
  - utterance: I poured in the water.
    expected_tool: workflow__ask_step
  - utterance: The kettle has reached the target.
    expected_tool: workflow__ask_step
  - utterance: What should I do at this stage?
    expected_tool: workflow__ask_step
  - utterance: What is the current reading?
    expected_tool: workflow__ask_step
  - utterance: How much steeping time remains?
    expected_tool: workflow__ask_step

steps:
  identify:
    observation: A tea package label reads Oolong, 88 C, steep 4 minutes.
    expected_updates: [tea_name, target_temperature_c, steep_duration_s, guidance_source, tea_ready]
  fill_water:
    observation: The kettle interior is visible with a clear water surface and level inside.
    expected_updates: [water_filled]
  heat_water:
    observation: The active kettle display shows a numeric reading of 86 C.
    state: {target_temperature_c: 88}
    expected_updates: [heating_started, water_ready]
  start_steeping:
    observation: A tea bag is visibly immersed in the water.
    expected_tools: [clock__now, workflow__commit]
  steep_timer:
    observation: {elapsed_s: 241, remaining_s: 0, expired: true}
    expected_updates: [steeping_complete]

rag_fallback:
  step: identify
  observation: A tea package label clearly reads Sencha; no brewing values are printed.
  expected_tools: [rag_lookup, workflow__commit]
  expected_top_k: 2
  expected_source: rag-documents/tea-brewing.md
  expected_tea_ready: true
  expected_atomic_updates: [tea_name, target_temperature_c, steep_duration_s, guidance_source, tea_ready]

irrelevant_retrieval_guard:
  observation: A package clearly reads Silver Needle White Tea.
  retrieval: General advice says to use fresh filtered water but gives no variety-specific values.
  forbidden_updates: [target_temperature_c, steep_duration_s, tea_ready]

identity_retrieval_mismatch:
  observation: A label reads Harbor Spice Black Tea; brewing values are absent.
  retrieval: Breakfast Blend uses boiling water and steeps for 4 minutes.
  expected_tools: [rag_lookup, workflow__commit]
  expected_updates: {}
  expected_tea_ready: false

identification_guard:
  readable_ocr: NUMI ORGANIC BLACK TEA BREAKFAST BLEND
  partial_ocr: CEDAR GROVE JASMINE GREEN
  unreadable_caption: Too dark to discern tea package text.
  empty_caption: There are no visible texts on any objects within this frame.
  none_caption: none
  expected_readable: true
  expected_partial: true
  expected_unreadable: false
  expected_empty: false
  generic_rag_allowed: false
  unreadable_expected_updates: {}
  unreadable_expected_message: ""

identification_atomic_guard:
  observation: Pine Harbor Genmaicha; no brewing values are visible.
  stale_state: {tea_name: Meadow Mint, tea_ready: false}
  forbidden_draft_updates: [tea_name, target_temperature_c, steep_duration_s, guidance_source, tea_ready]
  expected_unready_state: {}
  current_observation_wins: true

tea_identity_question:
  step: identify
  question: What tea is in the cup?
  state: {tea_ready: true}
  expected_tool: current_view
  forbidden_tool: rag_lookup

temperature_unit_guard:
  step: heat_water
  observation: A thermometer display reads 68°F.
  state: {target_temperature_c: 95, heating_started: true, water_ready: false}
  expected_tool: temperature__verify
  expected_updates: {heating_started: true}
  expected_water_ready: false

terse_temperature_caption:
  step: heat_water
  observation: 164F
  expected_evidence: true
  expected_updates: {heating_started: true}
  expected_water_ready: false

split_temperature_caption_guard:
  accepted:
    - >-
      The digital display shows 100°C. There are no visible hazards.
    - >-
      Heater-on indicators are not visible. The kettle display shows 100
      degrees Celsius.
  rejected:
    - No numeric display or thermometer reading is visible.

temperature_missing_unit_guard:
  step: heat_water
  observation: The kettle display visibly reads 91 with no unit shown.
  state: {target_temperature_c: 91, heating_started: true, water_ready: false}
  forbidden_tool: temperature__verify
  expected_updates: {}
  expected_water_ready: false

temperature_absent_guard:
  step: heat_water
  observation: Not visible.
  state: {target_temperature_c: 90, heating_started: false, water_ready: false}
  forbidden_tool: temperature__verify
  expected_updates: {}

temperature_repeated_below_target_guard:
  step: heat_water
  observations:
    - The kettle display reads 20°C.
    - The kettle display reads 25°C.
  state: {target_temperature_c: 98, heating_started: true, water_ready: false}
  expected_tool: temperature__verify
  expected_updates: [{}, {}]
  expected_evidence_count: 2
  expected_water_ready: false

temperature_above_target_ready:
  step: heat_water
  observation: The kettle display reads 100°C.
  state: {target_temperature_c: 82, heating_started: true, water_ready: false}
  expected_tool: temperature__verify
  expected_updates: {water_ready: true}
  expected_water_ready: true

state_update_notice:
  step: heat_water
  observation: A kettle display reads 82 degrees Fahrenheit.
  state: {target_temperature_c: 95, heating_started: false, water_ready: false}
  expected_updates: {heating_started: true}
  expected_message_intent: heating started
  expected_complete: false

routine_notice_guard:
  step: heat_water
  observation: The thermometer display repeatedly reads 77°F.
  state: {target_temperature_c: 90, heating_started: true, water_ready: false}
  repetitions: 3
  expected_updates: {}
  attempted_messages: ["The heater is active.", "The display reads 77 degrees Fahrenheit."]
  expected_spoken_messages: []

observation_context:
  keys: [observation, already_complete, state]
  prior_status_is_state_value: false
  contract_includes: [field_descriptions, completion_condition]
  writable_fields_are_goals: false

retrieval_context:
  chunk_size: 700
  overlap: 100
  query_suffix: water temperature steep time

completed_step:
  step: fill_water
  observation: The kettle interior is visible with a clear water surface and level inside.
  state: {water_filled: true}
  expected_tools: [workflow__commit]
  expected_updates: {}
  expected_transition: null

false_positive_guard:
  step: fill_water
  observation: No vessel interior or water is visible.
  proposed_updates: {water_filled: true}
  expected_accepted: false

steeping_negative_guard:
  observation: >-
    A cup with a tea bag is shown, but there is no visible evidence of the tea
    bag being immersed in water.
  expected_accepted: false

steeping_no_water_guard:
  observation: >-
    A dry tea bag rests inside an empty cup. No water surface or level and no
    tea-water contact are visible.
  expected_accepted: false
  expected_updates: {}
  forbidden_tool: clock__now

timer_running_guard:
  observation: {elapsed_s: 119, remaining_s: 61, expired: false}
  expected_updates: {}
  expected_steeping_complete: false

voice_tool_guards:
  fill_report:
    question: I filled the kettle.
    expected_tool: current_view
    visual_confirmation: false
  heat_reading:
    question: Is the water hot enough now?
    expected_tool: current_view
  steep_report:
    question: I put the infuser in the cup.
    expected_tool: current_view
    visual_confirmation: false
  timer_question:
    question: Is steeping finished?
    expected_tool: clock__timer

spoken_values:
  temperature_c: 100 degrees Celsius
  duration_240_s: 4 minutes
  duration_65_s: 1 minute and 5 seconds

spoken_style_guard:
  compact_input: "Refill due in 90 sec; progress=62%."
  expected_output: "The refill is due in 1 minute and 30 seconds, and progress is 62 percent."
  forbidden_fragments: ["90 sec", "=", "%"]
