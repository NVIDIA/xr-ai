[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tea-making-sample-model-servers"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = ["xr-ai-model-server-stack"]

[tool.uv.sources]
xr-ai-model-server-stack = { path = "../../../utils/xr-ai-model-server-stack", editable = true }

[project.scripts]
tea_making_sample_model_servers = "main:run"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
