# Sample workload overrides. Ports, models, and images come from each service's own YAML.
# These retain the existing conservative budgets; tune together on the target GPU.
# With explicit KV bytes, utilization is startup admission, not a total-memory cap.
speaker-stt:
  cuda_visible_devices: '0'
tts:
  cuda_visible_devices: '0'
omni:
  max_num_seqs: 4
  gpu_memory_utilization: 0.25
  kv_cache_memory_bytes: 2147483648
  spark_uma: true
embedding:
  gpu_memory_utilization: 0.08
  spark_uma: true
  # Avoid FlashAttention kernels incompatible with GB10 SM121 on driver 580
  # in the qualified vLLM 26.09 image. Other GPU profiles retain auto-selection.
  attention_backend: TRITON_ATTN
