# Continuous speech after the start phrase, not an always-open microphone.
mode: conversation
magic_phrases: []
listening_chime: false
followup_grace_s: 0.0

# Continuous dispatch after the start phrase, until the full stop phrase.
conversation:
  start_phrase: "Hey agent, let's start talking"
  stop_phrase: "Hey agent, let's stop talking"
  require_wake_phrase: false
  phrase_window_s: 6.0

# Require the shared speaker-ASR service, as in the normal local preset.
speaker:
  enabled: true
  backend: required
  base_url: http://127.0.0.1:8102
