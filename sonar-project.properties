sonar.projectKey=SW-Cloud_XR_XR-AI_xr-ai
sonar.qualitygate.wait=true

# The "JavaScript inside HTML" sensor crashes the embedded Node.js
# bridge on the runner. Node runs under QEMU and V8's GC dies. The
# HTML files in client-samples/web*/ contain only inline scripts that
# aren't worth scanning for security issues, so exclude them from JS
# analysis.
sonar.javascript.exclusions=client-samples/web/**,client-samples/web-xr/**

# Dependency resolution is centralized under dependency-manifest/: its committed
# uv, npm, and Gradle locks are regenerated and compared in CI. Per-project
# lockfiles are intentionally absent, so the text rules cannot discover the
# repository-level controls from the individual project descriptors.
#
# The Riva repository tests consume paths emitted by their own fake subprocess,
# rooted under pytest's private tmp_path. They do not accept untrusted paths.
sonar.issue.ignore.multicriteria=central-python-lock,central-web-lock,central-android-lock,riva-test-paths
sonar.issue.ignore.multicriteria.central-python-lock.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.central-python-lock.resourceKey=**/pyproject.toml
sonar.issue.ignore.multicriteria.central-web-lock.ruleKey=text:S8564
sonar.issue.ignore.multicriteria.central-web-lock.resourceKey=client-samples/web-xr-build/package.json
sonar.issue.ignore.multicriteria.central-android-lock.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.central-android-lock.resourceKey=client-samples/android/build.gradle.kts
sonar.issue.ignore.multicriteria.riva-test-paths.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.riva-test-paths.resourceKey=tests/test_model_servers_nim_riva_repository.py

# CPD (duplication) exclusions — files that are intentionally parallel
# by design. Each LLM/TTS backend, sample agent, and web
# demo is an independent unit sharing a templated scaffold; collapsing
# them would couple unrelated services and undermine the
# sample-as-template use case. Real duplication elsewhere
# (the hub, tests, agent-sdk/xr-ai-hub, etc.) is still detected.
sonar.cpd.exclusions=\
    services/*-llm/**, \
    services/*-tts/**, \
    services/vlm-server/**, \
    agent-samples/*/**, \
    model-server-samples/model-servers/**, \
    model-server-samples/model-servers-nim/**, \
    client-samples/web*/**
