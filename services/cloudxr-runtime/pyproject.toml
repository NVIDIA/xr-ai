[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudxr-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyyaml",
    # TLS signaling proxy for WebRTC clients (asyncio API, websockets >= 14).
    "websockets>=14.0",
    "xr-ai-launcher",
    "xr-ai-gpu",
    "xr-ai-logging",
]

[project.scripts]
cloudxr_runtime = "cloudxr_runtime.__main__:run"

[tool.uv.sources]
xr-ai-gpu = { path = "../../utils/xr-ai-gpu", editable = true }
xr-ai-launcher = { path = "../../utils/xr-ai-launcher", editable = true }
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["cloudxr_runtime"]
