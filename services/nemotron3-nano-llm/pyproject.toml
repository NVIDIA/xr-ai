[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemotron3-nano-llm-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # vLLM provides the OpenAI-compatible HTTP server, the Qwen3-coder
    # tool-call parser, the nano_v3 reasoning parser plugin, and the
    # FlashInfer NVFP4 MoE kernels.  0.12.0 is the minimum the model
    # card (nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4) calls for.
    "vllm>=0.12.0",
    "pyyaml>=6.0",
    # Xet speeds up weight download on first run.
    "huggingface-hub>=0.32.0",
    "hf-xet>=1.1.2,<2.0.0",
    "xr-ai-logging",
    "xr-ai-vllm",
]

[project.scripts]
nemotron3_nano_llm_server = "nemotron3_nano_llm_server.__main__:run"

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-vllm    = { path = "../../utils/xr-ai-vllm",    editable = true }

[tool.hatch.build.targets.wheel]
packages = ["nemotron3_nano_llm_server"]
