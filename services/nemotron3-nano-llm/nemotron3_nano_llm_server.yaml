# Nemotron-3-Nano LLM server configuration. The wrapper selects NVFP4 on
# Blackwell and FP8 on earlier supported GPU architectures.
# Auto-discovered by xr-ai-launcher (filename matches the
# 'nemotron3_nano_llm_server' process command) and passed as --config.
# Exposes an OpenAI-compatible API at http://localhost:8107/v1 via vLLM.
#
# Reasoning mode: the model's chat template defaults to
# ``enable_thinking=True``.  vLLM's ``--reasoning-parser nano_v3`` splits
# the resulting ``<think>…</think>`` into message.reasoning_content so the
# actual answer in message.content is never polluted — this is what keeps
# voice TTS from reading the reasoning aloud.

# The wrapper selects the checkpoint from the detected GPU compute capability.
model_blackwell: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
model_ada: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8

host: "0.0.0.0"
port: 8107
hf_token: ""

# Shared weight + reasoning-parser cache.  Resolves relative to this YAML;
# ../../models lands in the repo-root models/ directory shared by the other
# model services.
model_cache: ../../models

# Pin to a specific GPU (or comma-separated list for multi-GPU).
# Also controls which GPU the compute-capability query targets for model selection.
# Unset to use all GPUs visible to the process.
# cuda_visible_devices: "0"

# vLLM server knobs.
#
# On Blackwell (B200 / RTX PRO 6000 96 GB): NVFP4 weights are ~20 GB. The
# checked-in 0.85 value gives a dedicated server room for its KV cache; lower
# it in a reviewed GPU profile when sharing the device with another model.
#
# On Ada Lovelace (RTX 6000 Ada 48 GB): FP8 weights ~30 GB; run the LLM
# on a dedicated GPU and keep the vlm-server + stt-server on the second GPU.
# With LLM alone on a 48 GB card, 0.85 (~41 GB) gives ~11 GB for KV cache.
max_num_seqs:         8
tensor_parallel_size: 1
max_model_len:        32768

gpu_memory_utilization: 0.85

# Skip CUDA graph capture + FlashInfer MoE autotune at startup.  For
# NemotronH-30B-A3B-NVFP4 those two phases are silent (no log output)
# and take 3-8 min on first run — bad UX for a voice agent where the
# user is waiting for the server to become healthy.  Eager mode starts
# in ~5 s after weight load and is 10-20% slower per token, which is
# imperceptible for this workload (<250 tokens per turn, STT+VAD+TTS
# already dominate turn latency).  Set to ``false`` if you want
# maximum throughput and can wait for graph capture to finish.
enforce_eager: true

# vLLM runtime. If this key is omitted, the wrapper falls back to pip;
# the checked-in configuration below selects the NGC Docker container.
#   pip     — vllm CLI from this wrapper's venv (today's behavior)
#   docker  — `docker run nvcr.io/nvidia/vllm:<tag> vllm serve …`
# Both honor the same config keys above; only the runtime hosting vllm differs.
# docker mode requires Docker Engine + NVIDIA Container Toolkit and a
# `docker login nvcr.io` (or NGC_API_KEY in the environment).
vllm_backend: docker

# Container image used when vllm_backend: docker.  Override to pin a different
# tag, an internal mirror, or a custom build.
vllm_image: nvcr.io/nvidia/vllm:26.04-py3
