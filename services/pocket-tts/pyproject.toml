[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocket-tts-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anyio>=4.0",
    "pocket-tts==3.0.2",
    # The PyPI build includes CUDA libraries on Linux so one environment can
    # run the configured GPU path or fall back to CPU execution.
    "torch>=2.5.0",
    "huggingface-hub>=0.32.0",
    "hf-xet>=1.1.2,<2.0.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "xr-ai-launcher",
    "xr-ai-logging",
]

[project.scripts]
pocket_tts_server = "pocket_tts_server.__main__:run"

[tool.uv.sources]
xr-ai-launcher = { path = "../../utils/xr-ai-launcher", editable = true }
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["pocket_tts_server"]
