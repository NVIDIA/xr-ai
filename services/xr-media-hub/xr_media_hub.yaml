# XR Media Hub — reference configuration
#
# All available options are listed here. LiveKit credentials are required;
# replace the local-dev values below or set LIVEKIT_API_KEY and
# LIVEKIT_API_SECRET in the environment.
# Copy this file (or a subset of it) to your agent sample directory and
# edit as needed.  Relative paths are resolved from this file's directory.
#
# Run from services/xr-media-hub/:
#   uv run xr_media_hub            # auto-discovers this file
#   uv run xr_media_hub --config xr_media_hub.yaml

# ── LiveKit server ────────────────────────────────────────────────────────────
api_key:    devkey
api_secret: devsecret-xr-livekit-prototype-2026
room_name:  xr-room

lk_port_ws:  7880   # WebSocket signaling
lk_port_tcp: 7881   # WebRTC TCP fallback
lk_port_udp: 7882   # WebRTC UDP media

# Cloud VMs commonly have a private interface behind a public NAT. Enable
# STUN-based public-IP discovery so LiveKit advertises a reachable ICE address.
lk_use_external_ip: false
# Enable only when the cloud NAT does not support LiveKit's public-IP self-ping
# validation. Requires lk_use_external_ip: true.
lk_skip_external_ip_validation: false

# ── Web client server ─────────────────────────────────────────────────────────
enable_web_server: true
web_server_host:   "0.0.0.0"
web_server_port:   8080
# Path is relative to this file's directory.
web_client_dir:    ../../client-samples/web
# HTTPS is on by default. A self-signed cert is auto-generated on first run
# at ~/.local/share/xr-ai/web-server.crt. Browsers reach LiveKit via the
# same-origin wss://<host>:web_server_port/rtc proxy this server exposes.
# Set web_server_tls: false only when the hub should *not* terminate TLS
# itself — either a TLS-terminating reverse proxy (nginx, Caddy, Cloudflare
# Tunnel) sits in front and speaks plain http://+ws:// to the hub on the
# loopback, or you're doing localhost-only dev where browsers grant
# camera/mic on http://localhost. Supply your own cert/key with
# cert_file / key_file:
# cert_file: /path/to/cert.pem
# key_file:  /path/to/key.pem

# ── Optional: token server (legacy plain-HTTP entry point) ────────────────────
enable_token_server: true
# Bind port for the token server (default 8000). Change it if another service
# already holds 8000. Under WSL2 mirrored networking, Windows' IP Helper
# service (iphlpsvc) occupies 8000 and the hub aborts with "[Errno 98] address
# already in use"; either set a free port here, or add `ignoredPorts=8000`
# under `[experimental]` in %UserProfile%\.wslconfig and run `wsl --shutdown`.
# token_server_port: 8000

# ── Video recording (NVENC, optional) ─────────────────────────────────────────
# Requires pynvvideocodec.  Frames are encoded via NVENC and written as
# H.264 Annex B chunks.  Each chunk starts with an IDR frame and is
# independently decodable.  Chunks can be concatenated with `cat`.
#
# Storage defaults to a tmpfs path (/dev/shm/xr-ai/recordings) so writes
# go to RAM, not disk.  Eviction is FIFO once total chunk size across
# all participants exceeds max_total_bytes (default 500 MB).
#
# Leave commented out (or set enabled: false) to disable.
#
# video_recording:
#   enabled:         true
#   out_dir:         /dev/shm/xr-ai/recordings   # tmpfs by default — set to a disk path to persist
#   chunk_frames:    30                          # frames per chunk (1 s at 30 fps)
#   max_total_bytes: 524288000                   # 500 MB cap across all participants (0 = unlimited)
#   sample_fps:      30.0                        # recording frame rate (subsample if lower)
#   bitrate:         4000000                     # VBR target bitrate in bps
#   gpu_id:          0                           # NVENC GPU device index
