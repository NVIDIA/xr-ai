[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clef-server"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "accelerate>=1.2.0",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.32.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.5",
    "torch>=2.11.0",
    "torchvision>=0.28.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.34.0",
    "xr-ai-logging",
    "xr-ai-vllm",
]

[project.scripts]
clef_server = "clef_server.__main__:run"

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-vllm = { path = "../../utils/xr-ai-vllm", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["clef_server"]
