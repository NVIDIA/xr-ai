[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedding-server"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Security minimums for transitive dependencies.
    "dnspython>=2.9.2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    # CVE-2026-104874: fixed C-extension items-view reference leak.
    "multidict>=6.9.1",
    # Security floors for vLLM's HTTP and JWT dependencies.
    "urllib3>=2.8.0",
    "pyjwt>=2.15.1",
    # CVE-2026-80047: check remote-code consent before caching custom generation code.
    "transformers>=5.17.0",
    # Match the base vLLM release in NVIDIA NGC 26.11.
    # Keep all four pip environments aligned; GPU qualification is separate
    # from the NVIDIA container build and required for every version change.
    "vllm==0.33.0",
    # vLLM pins protobuf 7.36.1 only on s390x; preserve 7.36.2 elsewhere.
    "protobuf>=7.36.2; platform_machine != 's390x'",
    "protobuf==7.36.1; platform_machine == 's390x'",
    # CVE-2026-59951: reclaim stateful Streamable HTTP sessions.
    "mcp>=2.2.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.32.0",
    "hf-xet>=1.1.2,<2.0.0",
    "xr-ai-logging",
    "xr-ai-vllm",
]

[project.scripts]
embedding_server = "embedding_server.__main__:run"

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-vllm    = { path = "../../utils/xr-ai-vllm",    editable = true }

[tool.hatch.build.targets.wheel]
packages = ["embedding_server"]
