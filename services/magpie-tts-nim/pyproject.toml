[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magpie-tts-nim-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "xr-ai-logging",
]

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }

[project.scripts]
magpie_tts_nim_server = "magpie_tts_nim_server.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["magpie_tts_nim_server"]
