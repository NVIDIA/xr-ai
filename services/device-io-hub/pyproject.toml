[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "device-io-hub"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Agent-SDK (IPC types, codec, SHM, ProcessorEndpoint)
    "xr-ai-hub-client",
    # Shared loguru setup (setup_logging + stdlib InterceptHandler)
    "xr-ai-logging",
    # IPC layer — server side uses ZMQ directly (connector + hub)
    "pyzmq>=27.0",
    # LiveKit transport
    "livekit>=1.0",
    "livekit-api>=1.0",
    # Token server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=12.0",
    # Media processing
    "numpy>=1.24",
    # Config file
    "pyyaml>=6.0",
    # TLS certificate generation
    "cryptography>=42.0",
    # NVENC video recording (opt-in at runtime via video_recording.enabled in YAML)
    "PyNvVideoCodec>=2.2",
]

[project.scripts]
device_io_hub = "device_io_hub.__main__:run"

[tool.uv.sources]
xr-ai-hub-client = { path = "../../agent-sdk/xr-ai-hub", editable = true }
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["device_io_hub"]
