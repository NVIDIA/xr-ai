[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stt-server"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Patched logging and target policy, and reference-filesystem template evaluation.
    "hydra-core>=1.3.7",
    "fsspec>=2026.6.0",
    # CVE-2026-104874: fixed C-extension items-view reference leak.
    "multidict>=6.9.1",
    # CVE-2026-102598: reject Windows device names with empty ADS markers.
    "werkzeug>=3.1.9",
    # CVE-2026-58659: restrict pytorch-lightning checkpoint instantiators.
    "pytorch-lightning>=2.6.6",
    # CVE-2026-97687 and CVE-2026-97689: fixed HTTP transport.
    "urllib3>=2.8.0",
    # CVE-2026-80047: check remote-code consent before caching custom generation code.
    "transformers>=5.17.0",
    "nemo_toolkit[asr]>=2.5",
    "lightning>=2.6.6",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "huggingface-hub>=0.32.0",
    "hf-xet>=1.1.2,<2.0.0",
    "pyyaml>=6.0",
    "xr-ai-logging",
]

[tool.uv.sources]
# Use the reviewed upstream 2.6.6 commit for the umbrella package.
lightning     = { git = "https://github.com/Lightning-AI/pytorch-lightning", rev = "771017e4f39b314b49abd4a1d65905c74268d248" }
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }

[project.scripts]
stt_server = "stt_server.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["stt_server"]

[tool.uv]
# NeMo caps Hydra at 1.3.2 and Lightning at 2.4.0. These explicit overrides
# require GPU qualification; the patched umbrella package also permits fsspec 2026.
override-dependencies = ["hydra-core==1.3.7", "lightning==2.6.6"]
