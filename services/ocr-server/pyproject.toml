[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
# CUDA, PyTorch, and the upstream extension stay in the inference container.
dependencies = ["pyyaml>=6.0", "xr-ai-logging", "xr-ai-vllm"]

[project.scripts]
ocr_server = "ocr_server.__main__:run"

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-vllm = { path = "../../utils/xr-ai-vllm", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["ocr_server"]
