[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magpie-nim-tts"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "xr-ai-models[riva]",
    "xr-ai-logging",
    "xr-ai-vllm",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "grpcio>=1.67",
]

[tool.uv.sources]
xr-ai-models = { path = "../../agent-sdk/xr-ai-models", editable = true }
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-vllm = { path = "../../utils/xr-ai-vllm", editable = true }

[project.scripts]
magpie_nim_tts = "magpie_nim_tts.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["magpie_nim_tts"]
