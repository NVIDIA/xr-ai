[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma4-server"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
# vLLM runs in the pinned Docker image, outside the wrapper environment.
dependencies = ["pyyaml>=6.0", "xr-ai-logging", "xr-ai-vllm"]

[project.scripts]
gemma4_server = "gemma4_server.__main__:run"

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-vllm = { path = "../../utils/xr-ai-vllm", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["gemma4_server"]
