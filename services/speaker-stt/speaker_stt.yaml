# The private IPC endpoint defaults to the current user's 0700 runtime directory.
asr_model: nvidia/multitalker-parakeet-streaming-0.6b-v1
diar_model: nvidia/Nemotron-3-Diarization
device: cuda
precision: bf16
# Hardware profiles or CUDA_VISIBLE_DEVICES own GPU placement.
model_cache: ../../models
# Each session holds one ASR cache and one diarization cache.
max_sessions: 16
