# Loopback HTTP serves health/model identity; a private WebSocket carries PCM.
host: 127.0.0.1
port: 8102
asr_model: nvidia/multitalker-parakeet-streaming-0.6b-v1
diar_model: nvidia/Nemotron-3-Diarization
device: cuda
precision: bf16
# Hardware profiles or CUDA_VISIBLE_DEVICES own GPU placement.
model_cache: ../../models
# Before enrollment, each session holds up to eight ASR caches plus diarization state.
max_sessions: 16
