[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-speaker-stt"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Patched logging and target policy, and reference-filesystem template evaluation.
    "hydra-core>=1.3.8,<1.4",
    "fsspec>=2026.7.0",
    # CVE-2026-104874: fixed C-extension items-view reference leak.
    "multidict>=6.9.1",
    # CVE-2026-102598: reject Windows device names with empty ADS markers.
    "werkzeug>=3.1.9",
    # CVE-2026-58659: restrict pytorch-lightning checkpoint instantiators.
    "pytorch-lightning>=2.6.6,<2.7",
    "fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "anyio>=4.8.0", "numpy>=1.24", "pyyaml>=6.0",
    "xr-ai-voicegate", "xr-ai-logging", "xr-ai-launcher",
    "nemo-toolkit[asr]>=3.1,<3.2", "lightning>=2.6.6,<2.7", "lhotse==2.0.0a6",
]

[project.scripts]
speaker_stt = "speaker_stt.__main__:_run"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# Commit archives keep dependency index policy with the consuming service.
nemo-toolkit = { url = "https://github.com/NVIDIA-NeMo/Speech/archive/dec3f0d39d869193c00b49a198fe13613be914dc.tar.gz" }
lightning = { git = "https://github.com/Lightning-AI/pytorch-lightning", rev = "771017e4f39b314b49abd4a1d65905c74268d248" }
# Exact runtime artifact required by the pinned Speech revision. This keeps
# the new inference environment isolated without changing the global cutoff.
lhotse = { url = "https://files.pythonhosted.org/packages/18/ae/8ba7ee0b1db7fadf8de8f58121723a6b1ae3d88bdb0a1ffeee165b62d4ba/lhotse-2.0.0a6-py3-none-any.whl" }
xr-ai-voicegate = { path = "../../utils/xr-ai-voicegate", editable = true }
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-launcher = { path = "../../utils/xr-ai-launcher", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["speaker_stt"]
