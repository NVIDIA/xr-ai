[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-rag-service"
version = "0.1.0"
description = "Dense document retrieval service for XR AI."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "xr-ai-logging",
    "xr-ai-models",
    "xr-ai-tools[services]",
]

[project.scripts]
rag_service = "rag_service.__main__:run"

[tool.uv.sources]
xr-ai-logging = { path = "../../utils/xr-ai-logging", editable = true }
xr-ai-models = { path = "../../agent-sdk/xr-ai-models", editable = true }
xr-ai-tools = { path = "../../agent-sdk/xr-ai-tools", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["rag_service"]
