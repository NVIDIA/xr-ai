endpoint: tcp://0.0.0.0:8340
documents_dir: documents
models_config: models.local.json
embedding_role: embedding
cache_dir: .rag-cache
chunk_size: 900
overlap: 120
# Native output dimension of Nemotron 3 Embed 1B.
embedding_dim: 2048
batch_size: 32
min_score: 0.3
# Bump this if weights change without changing the server-reported model identity.
# This supplements (never replaces) the model identity and resolved embedding-role hash.
# Missing identity metadata disables persistence; lookup failures abort startup.
# cache_key: embedding-model-revision
