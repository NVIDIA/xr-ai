# Speaker-conditioned ASR on DGX Spark's single Blackwell GPU.
# GPU memory and latency require live qualification on this hardware.
endpoint: ipc:///tmp/xr-ai-speaker-stt.sock
asr_model: nvidia/multitalker-parakeet-streaming-0.6b-v1
diar_model: nvidia/Nemotron-3-Diarization
device: cuda
precision: bf16
cuda_visible_devices: "0"
model_cache: ../../../../models
max_sessions: 16
