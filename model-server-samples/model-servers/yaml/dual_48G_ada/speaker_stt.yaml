# Speech service selected by the normal model-server profiles.
# Match this HTTP address in each worker's voice_gate.yaml.
host: 127.0.0.1
port: 8102
asr_model: nvidia/multitalker-parakeet-streaming-0.6b-v1
diar_model: nvidia/Nemotron-3-Diarization
device: cuda
precision: bf16
# Speech on GPU 1; no additional batch-STT model is needed.
cuda_visible_devices: "1"
model_cache: ../../../../models
max_sessions: 16
