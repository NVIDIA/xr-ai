# Speech service selected by the normal model-server profiles.
# Match this private endpoint in each worker's voice_gate.yaml.
endpoint: ipc:///tmp/xr-ai-speaker-stt.sock
asr_model: nvidia/multitalker-parakeet-streaming-0.6b-v1
diar_model: nvidia/Nemotron-3-Diarization
device: cuda
precision: bf16
# Speech on GPU 1; no HTTP port or additional batch-STT model is needed.
cuda_visible_devices: "1"
model_cache: ../../../../models
max_sessions: 16
