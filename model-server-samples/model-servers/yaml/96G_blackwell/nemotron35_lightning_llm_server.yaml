# Nemotron 3.5 Lightning — single 96 GB Blackwell GPU. The NVFP4 checkpoint
# uses native FP4 kernels and leaves the rest of the GPU for the shared stack.
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4

host: "0.0.0.0"
port: 8108
served_model_name: llm
hf_token: ""
model_cache: ../../../../models

max_num_seqs: 8
tensor_parallel_size: 1
max_model_len: 32768
gpu_memory_utilization: 0.35
enable_prefix_caching: true
enforce_eager: false

kv_cache_dtype: fp8
mamba_backend: flashinfer
mamba_cache_mode: align

vllm_backend: docker
vllm_image: nvcr.io/nvidia/vllm:26.08-py3
