[project]
name = "semantic-turn-prototype"
version = "0.0.1"
requires-python = ">=3.11,<3.15"
dependencies = ["xr-ai-models", "xr-ai-voice", "xr-ai-interaction", "xr-ai-agent-runtime", "xr-ai-voicegate", "loguru>=0.7", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.uv.sources]
xr-ai-models = { path = "../../agent-sdk/xr-ai-models", editable = true }
xr-ai-voice = { path = "../../agent-sdk/xr-ai-voice", editable = true }
xr-ai-interaction = { path = "../../agent-sdk/xr-ai-interaction", editable = true }
xr-ai-agent-runtime = { path = "../../agent-sdk/xr-ai-runtime", editable = true }
xr-ai-voicegate = { path = "../../utils/xr-ai-voicegate", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["worker"]
testpaths = ["eval"]
