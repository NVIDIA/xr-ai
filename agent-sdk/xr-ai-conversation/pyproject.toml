[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-conversation"
version = "0.1.0"
description = "Participant-scoped conversation routing and destination contracts."
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-relay>=0.7.2,<0.8",
    "xr-ai-models",
]

[tool.uv.sources]
xr-ai-models = { path = "../xr-ai-models", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_conversation"]
