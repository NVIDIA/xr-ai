# One long session that forces repeated dialogue and source compaction: facts
# spread over many turns, a correction, one exchange far larger than the whole
# dialogue budget, and one source update far larger than its topic budget.
participant: priya
source: lab.notes
budgets:
  dialogue_bytes: 3000
  topic_bytes: 3000
  compaction_input_bytes: 6000
samples: 3
# Share of probe answers that must be correct.
min_recall: 0.8

turns:
  - user: Hi, my name is Priya and I'm setting up the lab for the spectrometer calibration.
  - user: Note that I'm allergic to latex, so only nitrile gloves for me.
    source_update: Detector temperature stable at -10.2 C.
  - user: The calibration meeting is on Monday at 3pm in room B214.
  - user: What is a good order to warm up a spectrometer and the cooling loop?
    source_update: Cooling loop flow 2.1 L/min, nominal.
  - user: We use the reference lamp serial HL-2000-77 for wavelength checks.
    source_update: Bench 3 has a cracked cuvette holder; do not use bench 3.
  - user:
      prefix: "Here is the full controller log, the important bit is at the end:"
      repeat: "[{index:05d}] INFO heartbeat ok temp=21.{digit}C"
      count: 400
      suffix: "[00400] ERROR interlock tripped code E-4471"
    source_update:
      prefix: "Raw detector dump follows:"
      repeat: "px{index}=0.{digit}{digit}"
      count: 700
  - user: "Correction: the meeting moved to Tuesday, same time and room."
  - user: Can you explain what dark-current subtraction does, briefly?
    source_update: Bench 3 holder replaced; bench 3 is usable again.
  - user: Also my preferred units are nanometers, not angstroms.
    source_update: Detector temperature drifted to -9.1 C after door opened.
  - user: How long should the lamp stabilise before taking a reference?
  - user: Remind me later that Jonas owns the cooling loop.
    source_update: Nitrogen purge started at 14:10.
  - user: What's the usual tolerance for a wavelength check?

# Asked after the session without recording an exchange. ``any_of`` must also
# appear in the final prompt context: compaction must not have lost the fact.
probes:
  - name: user-name
    question: What's my name?
    any_of: [priya]
  - name: corrected-meeting-day
    question: Which day is the calibration meeting?
    any_of: [tuesday]
  - name: meeting-room
    question: Which room is the calibration meeting in?
    any_of: [b214]
  - name: allergy
    question: What am I allergic to?
    any_of: [latex]
  - name: lamp-serial
    question: Which reference lamp serial do we use?
    any_of: [hl-2000-77]
  - name: log-error-code
    question: What error code was at the end of the controller log?
    any_of: [e-4471]
  - name: unit-preference
    question: Which units do I prefer for wavelengths?
    any_of: [nanomet, " nm"]
  - name: loop-owner
    question: Who owns the cooling loop?
    any_of: [jonas]
  - name: bench-3-latest-state
    question: Can I use bench 3 right now?
    any_of: ["yes", usable]
    none_of: [not usable, unavailable, should not]
    not_starting_with: ["no"]
  - name: purge-state
    question: Is a nitrogen purge running?
    any_of: ["yes", started, running]
    not_starting_with: ["no"]
