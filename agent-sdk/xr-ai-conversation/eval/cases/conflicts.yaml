# Seeded context states where a summary is older than material that
# contradicts it. A summary lags behind corrections until the next compaction,
# so answers must follow the newer material. Times are minutes after a fixed
# start; summaries cover minute 0.
samples: 5
# Each case must be answered correctly in this share of samples.
min_pass_rate: 0.8

cases:
  - name: correction-after-stale-dialogue-summary
    dialogue_summary: The user, Priya, has a calibration meeting on Monday at 3 pm in room B214.
    exchanges:
      - minute: 60
        user: "Correction: the meeting moved to Tuesday, same time and room."
        assistant: Noted, Tuesday at 3 pm in room B214.
    question: When is the calibration meeting?
    any_of: [tuesday]
    none_of: [monday at 3]

  - name: source-update-after-stale-source-summary
    source_summaries:
      lab.notes: Bench 3 has a cracked cuvette holder; do not use bench 3.
    source_updates:
      - minute: 30
        source: lab.notes
        text: Bench 3 holder replaced; bench 3 is usable again.
    exchanges:
      - minute: 45
        user: What's the usual tolerance for a wavelength check?
        assistant: Usually within 0.1 nm of the certified value.
    question: Can I use bench 3 right now?
    any_of: ["yes", usable]
    none_of: [not usable, unavailable, should not]
    not_starting_with: ["no"]

  - name: user-name-from-dialogue-summary
    dialogue_summary: Priya is setting up a spectrometer lab, is allergic to latex, and owns no equipment there.
    source_summaries:
      lab.notes: Jonas owns the cooling loop.
    exchanges:
      - minute: 50
        user: How long should the lamp stabilise?
        assistant: About 15 to 20 minutes.
    question: What's my name?
    any_of: [priya]
    none_of: [jonas]

  - name: newest-summary-topic-state
    summary_topics:
      - source: tea.status
        minute: 55
        text: Timer is at 6 minutes; steeping is complete.
    exchanges:
      - minute: 20
        user: Start a 4 minute timer for the tea.
        assistant: Started a 4 minute timer.
    question: Is the tea done steeping?
    any_of: ["yes", complete, done]
    not_starting_with: ["no"]

  - name: dialogue-correction-after-source-update
    source_updates:
      - minute: 10
        source: lab.notes
        text: Reference lamp in use is HL-1000-12.
    exchanges:
      - minute: 40
        user: "We swapped lamps: use HL-2000-77 from now on."
        assistant: Understood, HL-2000-77 from now on.
    question: Which reference lamp should I use?
    any_of: [hl-2000-77]
    none_of: [hl-1000-12 is the]
