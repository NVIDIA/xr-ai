[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-voice"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.10",
    "xr-ai-agent-runtime",
    "xr-ai-hub-client",
    "xr-ai-logging",
    "xr-ai-models",
    "xr-ai-vad",
    "xr-ai-voicegate",
    "pipecat-ai>=1.3",
    # NLTK 3.10.1 rejects its dependencies from in-project virtual environments.
    "nltk!=3.10.1",
    "numpy>=1.24",
    "scipy>=1.11",
]

[tool.uv.sources]
xr-ai-agent-runtime = { path = "../xr-ai-agent-runtime", editable = true }
xr-ai-hub-client      = { path = "../xr-ai-hub-client",                         editable = true }
xr-ai-logging    = { path = "../../utils/xr-ai-logging",   editable = true }
xr-ai-models     = { path = "../xr-ai-models",             editable = true }
xr-ai-vad        = { path = "../../utils/xr-ai-vad",       editable = true }
xr-ai-voicegate  = { path = "../../utils/xr-ai-voicegate", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_voice"]
