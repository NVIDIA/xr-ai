[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-interaction"
version = "0.1.0"
description = "Transport-neutral participant interaction messages for XR AI agents."
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_interaction"]
