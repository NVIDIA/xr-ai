[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-nat"
version = "0.1.0"
description = "Native Relay-managed tools and legacy NeMo Agent Toolkit compatibility for XR AI."
requires-python = ">=3.11,<3.13"
dependencies = [
    "nemo-relay>=0.7.2,<0.8",
    "pydantic>=2.10",
]

[project.optional-dependencies]
relay = ["xr-ai-models"]
live-vision = ["numpy>=1.24", "Pillow>=10.0", "xr-ai-hub-client", "xr-ai-models"]
agents = ["nvidia-nat-core==1.8.0", "nvidia-nat-langchain==1.8.0", "xr-ai-models"]
mcp = ["nvidia-nat-core==1.8.0", "fastmcp>=3.4,<4"]
services = ["nvidia-nat-core==1.8.0", "msgpack>=1.0", "pyzmq>=27.0"]
vision = ["nvidia-nat-core==1.8.0", "httpx>=0.27", "numpy>=1.24", "Pillow>=10.0", "xr-ai-hub-client", "xr-ai-models"]
voice = ["nvidia-nat-core==1.8.0", "xr-ai-voice"]

[project.entry-points."nat.plugins"]
xr_ai_nat_llm = "xr_ai_nat.llm.config"
xr_ai_nat_spatial_math = "xr_ai_nat.functions.spatial_math.functions"
xr_ai_nat_text_memory = "xr_ai_nat.functions.text_memory.functions"
xr_ai_nat_vision = "xr_ai_nat.functions.vision.functions"
xr_ai_nat_xr_tracking = "xr_ai_nat.functions.xr_tracking.functions"
xr_ai_nat_video_memory = "xr_ai_nat.functions.video_memory.functions"
xr_ai_nat_rag = "xr_ai_nat.functions.rag.functions"

[tool.uv.sources]
xr-ai-models = { path = "../xr-ai-models", editable = true }
xr-ai-hub-client = { path = "../xr-ai-hub-client", editable = true }
xr-ai-voice = { path = "../xr-ai-voice", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_nat"]
