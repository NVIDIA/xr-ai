[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-ai-routing"
version = "0.1.0"
description = "Participant-scoped agent routing and destination contracts."
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-relay>=0.7.2,<0.8",
    "xr-ai-models",
    "xr-ai-agent-runtime",
]

[project.optional-dependencies]
voice = ["xr-ai-voice"]

[tool.uv.sources]
xr-ai-models = { path = "../xr-ai-models", editable = true }
xr-ai-agent-runtime = { path = "../xr-ai-runtime", editable = true }
xr-ai-voice = { path = "../xr-ai-voice", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["xr_ai_routing"]
